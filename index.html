
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LUDO WARRIORS 3D BATTLE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#101923;
 color:white;font-family:Arial,sans-serif
}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{
 background:rgba(8,17,29,.9);
 border:1px solid #ffffff35;
 border-radius:13px;padding:10px 13px;
 backdrop-filter:blur(8px)
}
#top{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;
 align-items:flex-start;gap:8px
}
#brand{font-size:17px;font-weight:900;color:#ffcf66}
#turn{font-size:13px;margin-top:5px}
#status{font-size:11px;color:#c5d5e5;margin-top:4px}
button{
 pointer-events:auto;border:0;border-radius:12px;
 padding:13px 15px;font-weight:900;
 color:#192333;background:linear-gradient(135deg,#ffe6a1,#e49b28);
 cursor:pointer
}
button:disabled{opacity:.45}
#right{display:flex;gap:7px;align-items:center}
#dice{font-size:25px;min-width:48px;text-align:center}
#bottom{
 position:absolute;bottom:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;
 align-items:end;gap:8px
}
#message{font-size:11px;line-height:1.5;max-width:65%}
#scores{font-size:11px;line-height:1.7}
#toast{
 position:absolute;top:22%;left:50%;
 transform:translateX(-50%);
 background:#101d2dee;border:1px solid #ffffff40;
 border-radius:14px;padding:12px 17px;
 opacity:0;transition:.25s;font-weight:bold;
 text-align:center;pointer-events:none
}
@media(max-width:550px){
 #brand{font-size:13px}
 .panel{padding:8px}
 button{padding:12px 10px;font-size:11px}
 #message,#scores{font-size:9px}
}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud">
 <div id="top">
  <div class="panel">
   <div id="brand">⚔ LUDO WARRIORS 3D</div>
   <div id="turn">Navbat: Qizil</div>
   <div id="status">Zarni tashlang</div>
  </div>

  <div id="right">
   <div class="panel" id="dice">🎲</div>
   <button id="roll">ZAR TASHLA</button>
  </div>
 </div>

 <div id="bottom">
  <div class="panel" id="message">
   Jangchini bosing va yurishni boshlang.
   <br>🕳 Tuzoq · 🚀 Raketa · ⭐ Yulduzcha
  </div>
  <div class="panel" id="scores"></div>
 </div>

 <div id="toast"></div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =========================
   1. SAHNA VA KAMERA
========================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x142333);
scene.fog=new THREE.Fog(0x142333,45,90);

const camera=new THREE.PerspectiveCamera(
 38,innerWidth/innerHeight,.1,150
);

// Kamera doskaning yuqori burchagidan qaraydi
camera.position.set(17,32,25);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================
   2. YORUG'LIK
========================= */

scene.add(new THREE.HemisphereLight(
 0xd8eaff,0x34412e,2.2
));

const sun=new THREE.DirectionalLight(0xffe6bd,3.5);
sun.position.set(-12,25,15);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-20;
sun.shadow.camera.right=20;
sun.shadow.camera.top=20;
sun.shadow.camera.bottom=-20;
scene.add(sun);

const blueLight=new THREE.PointLight(0x398bff,35,40);
blueLight.position.set(8,9,-8);
scene.add(blueLight);

const goldLight=new THREE.PointLight(0xffb83d,20,25);
goldLight.position.set(-8,7,8);
scene.add(goldLight);

/* =========================
   3. MATERIALLAR
========================= */

function material(color,rough=.45,metal=.15){
 return new THREE.MeshStandardMaterial({
  color,
  roughness:rough,
  metalness:metal
 });
}

const colors=[
 {name:"Qizil",color:0xe83c45,start:0},
 {name:"Yashil",color:0x25c878,start:13},
 {name:"Ko‘k",color:0x398cff,start:26},
 {name:"Sariq",color:0xf5c542,start:39}
];

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(150,150),
 material(0x172c3b,.9)
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.75;
floor.receiveShadow=true;
scene.add(floor);

/* =========================
   4. DOSKA
========================= */

const board=new THREE.Group();
scene.add(board);

const boardBase=new THREE.Mesh(
 new THREE.BoxGeometry(14.8,.65,14.8),
 material(0x34495d,.32,.3)
);
boardBase.position.y=-.28;
boardBase.castShadow=true;
boardBase.receiveShadow=true;
board.add(boardBase);

// Doska chetidagi oltin bezak
const edgeMat=material(0xe0b75e,.25,.75);

for(let i=0;i<4;i++){
 const edge=new THREE.Mesh(
  new THREE.BoxGeometry(14.9,.09,.09),edgeMat
 );

 if(i<2){
  edge.position.set(0,.08,i===0?-7.4:7.4);
 }else{
  edge.rotation.y=Math.PI/2;
  edge.position.set(i===2?-7.4:7.4,.08,0);
 }

 board.add(edge);
}

/* =========================
   5. 52 TA YO'LAK KATAGI
========================= */

// 13 tadan 4 tomon = 52 katak
const path=[];

for(let side=0;side<4;side++){
 for(let i=0;i<13;i++){
  const t=-6+(12*i/13);

  if(side===0)path.push([t,-6]);
  if(side===1)path.push([6,t]);
  if(side===2)path.push([-t,6]);
  if(side===3)path.push([-6,-t]);
 }
}

const traps=[5,18,31,44];
const rockets=[9,22,35,48];
const stars=[2,15,28,41];

const tileMat=material(0xe4e9ed,.45,.15);

path.forEach((p,i)=>{
 let color=0xe0e5e9;

 if(traps.includes(i))color=0x982c36;
 if(rockets.includes(i))color=0x2779cf;
 if(stars.includes(i))color=0xe7b83c;

 const tile=new THREE.Mesh(
  new THREE.BoxGeometry(.9,.17,.9),
  material(color,.32,.2)
 );

 tile.position.set(p[0],.13,p[1]);
 tile.castShadow=true;
 tile.receiveShadow=true;
 board.add(tile);

 // Tuzoq belgisi
 if(traps.includes(i)){
  const trap=new THREE.Mesh(
   new THREE.TorusGeometry(.24,.075,10,24),
   material(0xff6252,.3,.5)
  );
  trap.position.set(p[0],.27,p[1]);
  board.add(trap);
 }

 // Raketa belgisi
 if(rockets.includes(i)){
  const rocket=new THREE.Group();

  const body=new THREE.Mesh(
   new THREE.CylinderGeometry(.11,.11,.42,12),
   material(0xf0e6dc,.3,.4)
  );

  const nose=new THREE.Mesh(
   new THREE.ConeGeometry(.13,.22,12),
   material(0xe64a38)
  );

  nose.position.y=.3;
  rocket.add(body,nose);
  rocket.position.set(p[0],.48,p[1]);
  board.add(rocket);
 }

 // Yulduz belgisi
 if(stars.includes(i)){
  const star=new THREE.Mesh(
   new THREE.OctahedronGeometry(.25),
   material(0xffe06a,.2,.7)
  );
  star.position.set(p[0],.45,p[1]);
  board.add(star);
 }
});

/* =========================
   6. JAMOA UYLARI
========================= */

const homes=[
 [-4.5,-4.5],
 [4.5,-4.5],
 [4.5,4.5],
 [-4.5,4.5]
];

homes.forEach((p,i)=>{
 const pad=new THREE.Mesh(
  new THREE.BoxGeometry(3.1,.24,3.1),
  material(colors[i].color,.3,.25)
 );

 pad.position.set(p[0],.12,p[1]);
 pad.castShadow=true;
 board.add(pad);

 const inside=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,.13,2.5),
  material(0x253544)
 );

 inside.position.set(p[0],.29,p[1]);
 board.add(inside);

 for(let j=0;j<4;j++){
  const x=p[0]+(j%2?.65:-.65);
  const z=p[1]+(j<2?-.65:.65);

  const ring=new THREE.Mesh(
   new THREE.CylinderGeometry(.4,.4,.09,24),
   material(0xf1e6ce,.3,.4)
  );

  ring.position.set(x,.4,z);
  board.add(ring);
 }
});

/* =========================
   7. FINISH YO'LAKLARI
========================= */

const finishLanes=[];

for(let ci=0;ci<4;ci++){

 const entry=path[(colors[ci].start+51)%52];
 const lane=[];

 // Har bir jamoaga 5 ta alohida rangli katak
 for(let i=1;i<=5;i++){
  const t=i/6;
  lane.push([
   entry[0]*(1-t),
   entry[1]*(1-t)
  ]);
 }

 // Oxirgi katak markaz
 lane.push([0,0]);
 finishLanes.push(lane);

 lane.forEach((p,index)=>{
  const tile=new THREE.Mesh(
   new THREE.BoxGeometry(.92,.2,.92),
   material(colors[ci].color,.3,.4)
  );

  tile.position.set(p[0],.26,p[1]);
  tile.castShadow=true;
  tile.receiveShadow=true;
  board.add(tile);
 });
}

// Markaziy finish
const finishBase=new THREE.Mesh(
 new THREE.CylinderGeometry(1.4,1.55,.3,8),
 material(0xffca59,.2,.8)
);

finishBase.position.y=.38;
board.add(finishBase);

const finishGem=new THREE.Mesh(
 new THREE.OctahedronGeometry(.55),
 material(0xffe7a0,.18,.85)
);

finishGem.position.y=.9;
board.add(finishGem);

function finishLane(ci,step){
 return finishLanes[ci][step-52];
}

/* =========================
   8. JANGCHI YASASH
========================= */

function createWarrior(ci){

 const root=new THREE.Group();

 const armor=material(colors[ci].color,.28,.55);
 const gold=material(0xe6bd67,.22,.8);
 const dark=material(0x26313d,.4,.5);
 const skin=material(0xc58c68,.7);

 // Tana
 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(.23,.31,.65,16),
  armor
 );

 body.position.y=.85;
 root.add(body);

 // Bosh
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.22,24,18),
  skin
 );

 head.position.y=1.35;
 root.add(head);

 // Dubulg'a
 const helmet=new THREE.Mesh(
  new THREE.SphereGeometry(.26,24,16),
  gold
 );

 helmet.scale.y=.7;
 helmet.position.y=1.44;
 root.add(helmet);

 const crest=new THREE.Mesh(
  new THREE.ConeGeometry(.1,.38,8),
  material(0xa12d3a)
 );

 crest.position.y=1.68;
 root.add(crest);

 const legs=[];
 const arms=[];

 for(const side of [-1,1]){

  const leg=new THREE.Group();
  leg.position.set(side*.13,.5,0);

  const legMesh=new THREE.Mesh(
   new THREE.CylinderGeometry(.09,.12,.43,12),
   dark
  );

  legMesh.position.y=-.2;
  leg.add(legMesh);
  root.add(leg);
  legs.push(leg);

  const arm=new THREE.Group();
  arm.position.set(side*.28,1.05,0);

  const armMesh=new THREE.Mesh(
   new THREE.CylinderGeometry(.075,.1,.42,12),
   armor
  );

  armMesh.position.y=-.18;
  arm.add(armMesh);
  root.add(arm);
  arms.push(arm);
 }

 // Qalqon
 const shield=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.25,.09,8),
  gold
 );

 shield.rotation.x=Math.PI/2;
 shield.position.set(-.43,.85,.08);
 root.add(shield);

 // Nayza
 const spear=new THREE.Group();

 const shaft=new THREE.Mesh(
  new THREE.CylinderGeometry(.025,.04,1.25,12),
  material(0x805b32,.35,.3)
 );

 shaft.position.y=.65;
 spear.add(shaft);

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(.1,.32,8),
  gold
 );

 tip.position.y=1.42;
 spear.add(tip);

 spear.position.set(.37,.05,0);
 root.add(spear);

 // Oyoq tagi
 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.34,.34,.12,24),
  dark
 );

 base.position.y=.06;
 root.add(base);

 root.userData={
  team:ci,
  legs:legs,
  arms:arms,
  spear:spear
 };

 root.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 return root;
}

/* =========================
   9. 16 TA JANGCHI
========================= */

const warriors=[];
const states=[];

for(let ci=0;ci<4;ci++){

 warriors[ci]=[];
 states[ci]=[];

 for(let j=0;j<4;j++){

  const w=createWarrior(ci);
  board.add(w);

  warriors[ci].push(w);
  states[ci].push({
   step:-1,
   done:false
  });
 }
}

function homePosition(ci,j){
 const p=homes[ci];

 return [
  p[0]+(j%2?.65:-.65),
  p[1]+(j<2?-.65:.65)
 ];
}

function globalIndex(ci,step){
 return (colors[ci].start+step)%52;
}

function getPosition(ci,s,j){

 if(s.step<0)return homePosition(ci,j);

 if(s.step>=56)return [0,0];

 if(s.step>=52)return finishLane(ci,s.step);

 return path[globalIndex(ci,s.step)];
}

function updatePositions(){

 for(let ci=0;ci<4;ci++){
  for(let j=0;j<4;j++){

   const s=states[ci][j];
   const p=getPosition(ci,s,j);

   warriors[ci][j].position.set(
    p[0],.22,p[1]
   );
  }
 }
}

updatePositions();

/* =========================
   10. OVOZLAR
========================= */

let audio=null;

function sound(type){

 try{

  audio ||= new (
   window.AudioContext||
   window.webkitAudioContext
  )();

  if(audio.state==="suspended")audio.resume();

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.connect(gain);
  gain.connect(audio.destination);

  const now=audio.currentTime;

  const sounds={
   dice:[240,.13],
   walk:[130,.07],
   spear:[100,.22],
   boom:[65,.55],
   rocket:[450,.35],
   star:[880,.3],
   trap:[75,.4]
  };

  const c=sounds[type]||[200,.1];

  osc.frequency.setValueAtTime(c[0],now);

  osc.frequency.exponentialRampToValueAtTime(
   Math.max(30,c[0]*.3),
   now+c[1]
  );

  gain.gain.setValueAtTime(.001,now);
  gain.gain.linearRampToValueAtTime(.15,now+.02);
  gain.gain.exponentialRampToValueAtTime(.001,now+c[1]);

  osc.start(now);
  osc.stop(now+c[1]+.02);

 }catch(e){}
}

/* =========================
   11. O'YIN HOLATI
========================= */

let current=0;
let dice=null;
let busy=false;

const all=warriors.flat();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function toast(text){

 const el=document.getElementById("toast");

 el.textContent=text;
 el.style.opacity=1;

 clearTimeout(toast.timer);

 toast.timer=setTimeout(()=>{
  el.style.opacity=0;
 },1800);
}

function updateUI(){

 document.getElementById("turn").textContent=
  "Navbat: "+colors[current].name;

 document.getElementById("status").textContent=
  dice===null?"Zarni tashlang":"Zar: "+dice+" — jangchini tanlang";

 document.getElementById("roll").disabled=
  dice!==null||busy;

 document.getElementById("scores").innerHTML=
  colors.map((c,i)=>
   `<span style="color:#${c.color.toString(16)}">${c.name}: ${states[i].filter(s=>s.done).length}/4</span><br>`
  ).join("");
}

function nextTurn(extra=false){

 dice=null;

 if(!extra){
  current=(current+1)%4;
 }

 updateUI();
}

/* =========================
   12. ZAR
========================= */

document.getElementById("roll").onclick=()=>{

 if(busy||dice!==null)return;

 sound("dice");

 dice=1+Math.floor(Math.random()*6);

 document.getElementById("dice").textContent=
  ["⚀","⚁","⚂","⚃","⚄","⚅"][dice-1];

 const possible=states[current].some(s=>
  !s.done&&(
   s.step<0?dice===6:s.step+dice<=56
  )
 );

 updateUI();

 if(!possible){
  toast("Yurish mumkin emas!");
  setTimeout(()=>nextTurn(),900);
 }
};

/* =========================
   13. PORTLASH
========================= */

function explosion(pos){

 sound("boom");

 const group=new THREE.Group();
 group.position.copy(pos);
 board.add(group);

 const particles=[];

 const particleMaterials=[
  material(0xffd45b),
  material(0xff752c),
  material(0xffffff)
 ];

 for(let i=0;i<30;i++){

  const m=new THREE.Mesh(
   new THREE.SphereGeometry(.09,8,8),
   particleMaterials[i%3]
  );

  group.add(m);

  particles.push({
   mesh:m,
   velocity:new THREE.Vector3(
    (Math.random()-.5)*.25,
    Math.random()*.25,
    (Math.random()-.5)*.25
   )
  });
 }

 const start=performance.now();

 function animate(now){

  const t=(now-start)/650;

  particles.forEach(p=>{
   p.mesh.position.add(p.velocity);
   p.mesh.scale.setScalar(Math.max(.01,1-t));
  });

  if(t<1){
   requestAnimationFrame(animate);
  }else{
   board.remove(group);
  }
 }

 requestAnimationFrame(animate);
}

/* =========================
   14. JANG ANIMATSIYASI
========================= */

function capture(ci,j,done){

 const w=warriors[ci][j];
 const spear=w.userData.spear;

 sound("spear");

 const start=performance.now();

 function animate(now){

  const t=Math.min(1,(now-start)/650);

  // Nayza zarbasi
  spear.position.z=-Math.sin(t*Math.PI)*.75;

  spear.rotation.x=
   Math.sin(t*Math.PI)*.4;

  w.position.y=
   .22+Math.sin(t*Math.PI)*.4;

  if(t<1){
   requestAnimationFrame(animate);
  }else{

   spear.position.z=0;
   spear.rotation.x=0;
   w.position.y=.22;

   explosion(w.position.clone());

   states[ci][j].step=-1;
   updatePositions();

   done();
  }
 }

 requestAnimationFrame(animate);
}

/* =========================
   15. YURISH ANIMATSIYASI
========================= */

function animateWalk(w,from,to,done){

 const start=performance.now();
 const duration=190;

 const legs=w.userData.legs;
 const arms=w.userData.arms;

 sound("walk");

 function animate(now){

  const t=Math.min(1,(now-start)/duration);

  w.position.lerpVectors(from,to,t);

  w.position.y=
   .22+Math.abs(Math.sin(t*Math.PI*2))*.13;

  legs.forEach((l,i)=>{
   l.rotation.x=
    Math.sin(t*Math.PI*4+i*Math.PI)*.65;
  });

  arms.forEach((a,i)=>{
   a.rotation.x=
    Math.sin(t*Math.PI*4+i*Math.PI)*.4;
  });

  if(t<1){
   requestAnimationFrame(animate);
  }else{

   w.position.copy(to);
   w.position.y=.22;

   legs.forEach(l=>l.rotation.x=0);
   arms.forEach(a=>a.rotation.x=0);

   done();
  }
 }

 requestAnimationFrame(animate);
}

/* =========================
   16. YANGI YURISH
========================= */

function moveWarrior(ci,j){

 if(busy||dice===null||ci!==current)return;

 const s=states[ci][j];

 if(s.done)return;

 if(s.step<0&&dice!==6){
  toast("Uyidan chiqish uchun 6 kerak!");
  return;
 }

 if(s.step>=0&&s.step+dice>56){
  toast("Finishga yetish uchun aniq son kerak!");
  return;
 }

 busy=true;

 const target=s.step<0?0:s.step+dice;
 let step=s.step<0?-1:s.step;

 const w=warriors[ci][j];

 function oneStep(){

  if(step<target){

   step++;

   const p=step>=52
    ?finishLane(ci,step)
    :path[globalIndex(ci,step)];

   const from=w.position.clone();

   const to=new THREE.Vector3(
    p[0],.22,p[1]
   );

   animateWalk(w,from,to,oneStep);

   return;
  }

  s.step=target;

  // Finish
  if(target===56){

   s.done=true;
   w.position.set(0,.5,0);

   busy=false;

   toast("🏆 Jangchi finishga yetdi!");

   if(states[current].every(x=>x.done)){
    toast(colors[current].name+" g‘alaba qozondi!");
    dice=null;
    updateUI();
   }else{
    nextTurn(dice===6);
   }

   return;
  }

  // Raqibni tekshirish
  let victim=null;

  if(target<52){

   const idx=globalIndex(ci,target);

   for(let oi=0;oi<4;oi++){

    if(oi===ci)continue;

    for(let oj=0;oj<4;oj++){

     const os=states[oi][oj];

     if(
      os.step>=0&&
      os.step<52&&
      !os.done&&
      globalIndex(oi,os.step)===idx
     ){
      victim={ci:oi,j:oj};
      break;
     }
    }

    if(victim)break;
   }
  }

  if(victim){

   toast("⚔ Nayza zarbasi! Raqib uyiga qaytdi!");

   capture(victim.ci,victim.j,finishMove);

  }else{

   finishMove();
  }
 }

 function finishMove(){

  const idx=target<52?globalIndex(ci,target):-1;

  // Tuzoq
  if(traps.includes(idx)){

   sound("trap");
   toast("🕳 Tuzoq! Jangchi uyiga qaytdi!");

   s.step=-1;
   updatePositions();

  }

  // Raketa
  else if(rockets.includes(idx)){

   sound("rocket");

   toast("🚀 Raketa! 5 qadam oldinga!");

   s.step=Math.min(56,s.step+5);

   if(s.step===56){
    s.done=true;
   }

   updatePositions();

  }

  // Yulduzcha
  else if(stars.includes(idx)){

   sound("star");

   toast("⭐ Yulduzcha! Yana bir yurish!");

   updatePositions();

   busy=false;
   dice=null;
   updateUI();
   return;
  }

  busy=false;
  updatePositions();

  if(states[current].every(x=>x.done)){

   toast("🏆 "+colors[current].name+" g‘alaba qozondi!");

   dice=null;
   updateUI();

  }else{

   nextTurn(dice===6);
  }
 }

 oneStep();
}

/* =========================
   17. JANGCHINI TANLASH
========================= */

renderer.domElement.addEventListener(
 "pointerdown",e=>{

  if(busy||dice===null)return;

  const rect=renderer.domElement.getBoundingClientRect();

  pointer.x=
   ((e.clientX-rect.left)/rect.width)*2-1;

  pointer.y=
   -((e.clientY-rect.top)/rect.height)*2+1;

  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObjects(all,true);

  if(!hits.length)return;

  let node=hits[0].object;

  while(node&&!all.includes(node)){
   node=node.parent;
  }

  if(node){

   const n=all.indexOf(node);

   moveWarrior(
    Math.floor(n/4),
    n%4
   );
  }
 }
);

/* =========================
   18. KAMERA O'LCHAMI
========================= */

function resize(){

 camera.aspect=innerWidth/innerHeight;

 // Telefon va kompyuterda doskani sig‘dirish
 const portrait=innerWidth<innerHeight;

 camera.position.set(
  portrait?0:15,
  portrait?38:32,
  portrait?32:25
 );

 camera.lookAt(0,0,0);
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}

addEventListener("resize",resize);
resize();

/* =========================
   19. ANIMATSIYA
========================= */

const clock=new THREE.Clock();

function render(){

 requestAnimationFrame(render);

 const t=clock.getElapsedTime();

 finishGem.rotation.y=t*.6;
 finishGem.position.y=.9+Math.sin(t*2)*.12;

 renderer.render(scene,camera);
}

updatePositions();
updateUI();
render();

</script>
