<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ludo Warriors</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#079de0;color:white;font-family:Arial;
 touch-action:manipulation
}
#rotate{
 position:fixed;inset:0;background:#101e30;z-index:20;
 display:none;align-items:center;justify-content:center;
 text-align:center;padding:25px
}
#rotate .inner{max-width:330px}
#rotate .phone{font-size:65px;animation:turn 1.5s infinite}
@keyframes turn{50%{transform:rotate(90deg)}}
#game{position:fixed;inset:0;display:none}
canvas{width:100%;height:100%;display:block}
#top{
 position:absolute;top:7px;left:9px;right:9px;
 display:flex;justify-content:space-between;align-items:start;
 pointer-events:none
}
.panel{
 background:#102b45eF;border:2px solid #ffffff75;
 border-radius:15px;padding:8px 12px;
 box-shadow:0 3px 8px #002b4855
}
#info{font-size:13px;line-height:1.7}
#info b{color:#ffdc80;font-size:16px}
#bottom{
 position:absolute;bottom:7px;left:9px;right:9px;
 display:flex;justify-content:space-between;align-items:end;
 gap:8px;pointer-events:none
}
#scores{font-size:12px;line-height:1.65}
#controls{
 display:flex;align-items:center;gap:9px;
 pointer-events:auto
}
#dice{
 width:57px;height:57px;border-radius:15px;
 font-size:32px;background:#17354e;color:white;
 border:2px solid #ffe2a0
}
#roll{
 height:55px;padding:0 19px;border:2px solid white;
 border-radius:14px;background:linear-gradient(135deg,#fff0ae,#d89b31);
 color:#293443;font-weight:900;font-size:15px
}
button:disabled{opacity:.4}
#sound{
 position:absolute;top:72px;right:12px;
 background:#17354e;color:white;border:1px solid #ffffff80;
 border-radius:50%;width:36px;height:36px;
 pointer-events:auto
}
@media(orientation:portrait){
 #rotate{display:flex}
 #game{display:none}
}
@media(orientation:landscape){
 #rotate{display:none}
 #game{display:block}
}
@media(max-height:450px){
 #info{font-size:10px;padding:5px 8px}
 #info b{font-size:12px}
 #bottom{bottom:4px}
 #scores{font-size:10px}
 #roll{height:43px;font-size:12px}
 #dice{width:45px;height:45px;font-size:25px}
}
</style>
</head>
<body>

<div id="rotate">
 <div class="inner">
  <div class="phone">📱</div>
  <h2>TELEFONNI YONBOSH QILING</h2>
  <p>O‘yinni boshlash uchun telefoningizni gorizontal holatga aylantiring.</p>
  <div style="font-size:35px">↻</div>
 </div>
</div>

<div id="game">
 <canvas id="board"></canvas>

 <div id="top">
  <div class="panel" id="info">
   <b>⚔ LUDO WARRIORS</b><br>
   <span id="turn">Qizil navbati</span><br>
   <span id="status">Zarni tashlang</span>
  </div>
  <button id="sound">♫</button>
 </div>

 <div id="bottom">
  <div class="panel" id="scores"></div>
  <div id="controls">
   <div class="panel" id="dice">🎲</div>
   <button id="roll">ZAR TASHLA</button>
  </div>
 </div>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d",{alpha:false});

const names=["Qizil","Yashil","Ko‘k","Sariq"];
const colors=["#ed202e","#078d28","#075be4","#ffcc13"];
const dark=["#a50c1a","#075d18","#063b9b","#b78600"];
const light=["#ff7272","#67dc78","#79aaff","#ffe78a"];

let W=0,H=0,D=1,U=1,OX=0,OY=0;
let current=0,dice=null,busy=false;
let soundOn=true,audio=null,musicTimer=null;
let gameOver=false;
let lastRender=0;

const states=names.map(()=>Array.from({length:4},()=>({
 step:-1,done:false
})));

const homes=[
 [2,2],[11,2],[11,11],[2,11]
];

const path=[];
for(let i=0;i<14;i++)path.push([i,0]);
for(let i=1;i<14;i++)path.push([13,i]);
for(let i=12;i>=-1;i--)path.push([i,13]);
for(let i=12;i>=1;i--)path.push([0,i]);

// 52 katak
path.length=52;

const traps=[5,18,31,44];
const stars=[2,15,28,41];
const rockets=[9,22,35,48];
const starts=[0,13,26,39];

let positions=[];
let animation=null;
let particles=[];
let monster=null;
let messageTimer=0;

function point(u,v){
 return {
  x:OX+(u-v)*U,
  y:OY+(u+v-13)*U*.5
 };
}

function resize(){
 W=innerWidth;H=innerHeight;
 D=Math.min(devicePixelRatio||1,1.25);

 canvas.width=Math.round(W*D);
 canvas.height=Math.round(H*D);
 ctx.setTransform(D,0,0,D,0,0);

 U=Math.min(W/29,H/16.3);
 U=Math.max(5,U);

 OX=W/2;
 OY=H/2;

 draw();
}
addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,250));

function polygon(points,fill,stroke=null,width=1){
 ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
 ctx.closePath();
 ctx.fillStyle=fill;
 ctx.fill();
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.lineWidth=width;
  ctx.stroke();
 }
}

function rectTile(u,v,color){
 const p=point(u,v),s=U*.44;
 polygon([
  {x:p.x-s,y:p.y},
  {x:p.x,y:p.y-s*.5},
  {x:p.x+s,y:p.y},
  {x:p.x,y:p.y+s*.5}
 ],color,"#ffffff80",1);
}

function background(){
 ctx.fillStyle="#079ee2";
 ctx.fillRect(0,0,W,H);

 // Dengiz to‘lqinlari
 ctx.strokeStyle="#67d5f2";
 ctx.lineWidth=2;
 for(let i=0;i<8;i++){
  const x=(i*177+80)%W;
  const y=(i*91+60)%H;
  ctx.beginPath();
  ctx.ellipse(x,y,38,8,-.2,0,Math.PI*2);
  ctx.stroke();
 }
}

function drawIsland(){
 const a=point(-1,-1),b=point(14,-1);
 const c=point(14,14),d=point(-1,14);

 // Orolning pastki qismi
 polygon([
  {x:a.x,y:a.y+U*.7},
  {x:b.x,y:b.y+U*.7},
  {x:c.x,y:c.y+U*.7},
  {x:d.x,y:d.y+U*.7}
 ],"#a96a27");

 polygon([a,b,c,d],"#9bc63b","#fff0ad",U*.16);

 // Orol usti
 polygon([
  {x:a.x,y:a.y-U*.12},
  {x:b.x,y:b.y-U*.12},
  {x:c.x,y:c.y-U*.12},
  {x:d.x,y:d.y-U*.12}
 ],"#a8d34b","#fff2a9",U*.09);

 // Yashil maydon bezaklari
 for(let i=0;i<24;i++){
  const u=1+(i*7%12);
  const v=1+(i*11%12);
  const p=point(u,v);
  ctx.fillStyle="#6eaa38";
  ctx.beginPath();
  ctx.arc(p.x,p.y,Math.max(2,U*.065),0,Math.PI*2);
  ctx.fill();
 }
}

function drawTrack(){
 path.forEach((p,i)=>{
  let col="#a6d247";
  if(traps.includes(i))col="#b9a14b";
  if(stars.includes(i))col="#b4d951";
  if(rockets.includes(i))col="#8fbd36";

  rectTile(p[0],p[1],col);

  if(traps.includes(i)){
   const q=point(p[0],p[1]);
   ctx.fillStyle="#5d301f";
   ctx.beginPath();
   ctx.arc(q.x,q.y,U*.11,0,Math.PI*2);
   ctx.fill();
   ctx.strokeStyle="#f6d17b";
   ctx.lineWidth=2;
   ctx.stroke();
  }

  if(stars.includes(i)){
   const q=point(p[0],p[1]);
   ctx.fillStyle="#fff3a0";
   ctx.font=`${U*.35}px Arial`;
   ctx.textAlign="center";
   ctx.fillText("★",q.x,q.y+U*.13);
  }

  if(rockets.includes(i)){
   const q=point(p[0],p[1]);
   ctx.font=`${U*.3}px Arial`;
   ctx.textAlign="center";
   ctx.fillText("🚀",q.x,q.y+U*.1);
  }
 });
}

function drawLanes(){
 for(let ci=0;ci<4;ci++){
  for(let i=1;i<=5;i++){
   const t=i/6;
   const p=path[(starts[ci]+51)%52];
   const u=p[0]*(1-t)+6.5*t;
   const v=p[1]*(1-t)+6.5*t;
   rectTile(u,v,colors[ci]);
  }
 }
}

function drawCastle(ci){
 const h=homes[ci];
 const p=point(h[0],h[1]);
 const size=U*1.9;

 // Qal'a soyasi
 ctx.fillStyle="#34475d";
 ctx.fillRect(p.x-size*.8,p.y-size*.52,size*1.6,size*1.05);

 // Devor
 ctx.fillStyle="#7c8b9e";
 ctx.fillRect(p.x-size*.8,p.y-size*.7,size*1.6,size*.22);
 ctx.fillStyle="#43566d";
 ctx.fillRect(p.x-size*.8,p.y-size*.48,size*1.6,size*.95);

 // Qal'a minoralari
 for(let x of [-.8,.8]){
  for(let y of [-.65,.5]){
   ctx.fillStyle="#aebac8";
   ctx.fillRect(p.x+x*size-size*.12,p.y+y*size-size*.15,size*.24,size*.3);
  }
 }

 // Ichki rangli hovli
 ctx.fillStyle=dark[ci];
 ctx.fillRect(p.x-size*.65,p.y-size*.34,size*1.3,size*.7);

 // Bayroqlar
 ctx.strokeStyle="#273746";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(p.x-size*.62,p.y-size*.75);
 ctx.lineTo(p.x-size*.62,p.y-size*1.18);
 ctx.stroke();
 ctx.fillStyle=colors[ci];
 ctx.beginPath();
 ctx.moveTo(p.x-size*.62,p.y-size*1.18);
 ctx.lineTo(p.x-size*.25,p.y-size*1.04);
 ctx.lineTo(p.x-size*.62,p.y-size*.92);
 ctx.fill();
}

function warrior(ci,x,y,scale=1,selected=false){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);

 // Soyasi
 ctx.fillStyle="#10202a80";
 ctx.beginPath();
 ctx.ellipse(0,2,13,5,0,0,Math.PI*2);
 ctx.fill();

 // Oyoqlar
 ctx.fillStyle="#17212b";
 ctx.fillRect(-8,-14,6,15);
 ctx.fillRect(3,-14,6,15);

 // Etik
 ctx.fillStyle="#101820";
 ctx.fillRect(-10,-3,9,5);
 ctx.fillRect(2,-3,10,5);

 // Tana
 ctx.fillStyle=dark[ci];
 ctx.fillRect(-10,-35,20,23);

 ctx.fillStyle=colors[ci];
 ctx.fillRect(-8,-34,16,18);

 // Qo‘llar
 ctx.fillStyle=colors[ci];
 ctx.fillRect(-15,-33,6,18);
 ctx.fillRect(9,-33,6,18);

 // Bosh
 ctx.fillStyle="#e4b38d";
 ctx.beginPath();
 ctx.arc(0,-42,8,0,Math.PI*2);
 ctx.fill();

 // Dubulg‘a
 ctx.fillStyle="#aab6c2";
 ctx.beginPath();
 ctx.arc(0,-45,10,Math.PI,0);
 ctx.lineTo(10,-43);
 ctx.lineTo(-10,-43);
 ctx.fill();

 ctx.fillStyle="#d6e0e9";
 ctx.fillRect(-10,-46,20,4);

 // Nayza
 ctx.strokeStyle="#3a2920";
 ctx.lineWidth=2.5;
 ctx.beginPath();
 ctx.moveTo(13,-22);
 ctx.lineTo(17,-57);
 ctx.stroke();

 ctx.fillStyle="#dbe5ee";
 ctx.beginPath();
 ctx.moveTo(17,-65);
 ctx.lineTo(13,-55);
 ctx.lineTo(21,-55);
 ctx.fill();

 if(selected){
  ctx.strokeStyle="#fff5a4";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,-24,21,0,Math.PI*2);
  ctx.stroke();
 }
 ctx.restore();
}

function homePos(ci,j){
 const h=homes[ci];
 const offsets=[
  [-.35,-.35],[.35,-.35],
  [-.35,.35],[.35,.35]
 ];
 return point(h[0]+offsets[j][0],h[1]+offsets[j][1]);
}

function getPos(ci,s,j){
 if(s.step<0)return homePos(ci,j);
 if(s.step>=52){
  const t=(s.step-51)/5;
  const p=path[(starts[ci]+51)%52];
  return point(p[0]*(1-t)+6.5*t,p[1]*(1-t)+6.5*t);
 }
 const idx=(starts[ci]+s.step)%52;
 return point(path[idx][0],path[idx][1]);
}

function drawWarriors(){
 positions=[];
 for(let ci=0;ci<4;ci++){
  for(let j=0;j<4;j++){
   const s=states[ci][j];
   if(s.done)continue;
   const p=getPos(ci,s,j);
   const selected=animation&&animation.ci===ci&&animation.j===j;
   positions.push({ci,j,x:p.x,y:p.y});
   warrior(ci,p.x,p.y,Math.max(.65,U/15),selected);
  }
 }
}

function drawCenter(){
 const p=point(6.5,6.5);
 const s=U*1.15;

 polygon([
  {x:p.x-s,y:p.y},
  {x:p.x,y:p.y-s*.5},
  {x:p.x+s,y:p.y},
  {x:p.x,y:p.y+s*.5}
 ],"#e8b64c","#fff0a1",3);

 ctx.fillStyle="#49376c";
 ctx.fillRect(p.x-s*.48,p.y-s*.4,s*.96,s*.45);
 ctx.font=`${U*.8}px Arial`;
 ctx.textAlign="center";
 ctx.fillText("👑",p.x,p.y+U*.1);
}

function drawEffects(){
 if(monster){
  const p=monster;
  ctx.font=`${U*1.5}px Arial`;
  ctx.textAlign="center";
  ctx.fillText("👹",p.x,p.y);
 }
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();
 });
 ctx.globalAlpha=1;
}

function draw(){
 if(!W)return;
 background();
 drawIsland();
 drawTrack();
 drawLanes();

 for(let i=0;i<4;i++)drawCastle(i);

 drawCenter();
 drawWarriors();
 drawEffects();
}

function render(t){
 requestAnimationFrame(render);
 if(t-lastRender<33)return;
 lastRender=t;
 if(animation||particles.length||monster)draw();
}
requestAnimationFrame(render);

/* AUDIO */

function initAudio(){
 if(!soundOn)return;
 try{
  audio ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
 }catch(e){}
}

function tone(freq,duration,type="sine",volume=.12){
 if(!soundOn)return;
 initAudio();
 if(!audio)return;
 try{
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(
   Math.max(30,freq*.35),audio.currentTime+duration
  );
  g.gain.setValueAtTime(.001,audio.currentTime);
  g.gain.linearRampToValueAtTime(volume,audio.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration+.02);
 }catch(e){}
}

function noise(duration,volume=.15){
 if(!soundOn)return;
 initAudio();
 if(!audio)return;
 try{
  const length=Math.floor(audio.sampleRate*duration);
  const buffer=audio.createBuffer(1,length,audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
  const src=audio.createBufferSource();
  const gain=audio.createGain();
  src.buffer=buffer;
  gain.gain.value=volume;
  src.connect(gain);gain.connect(audio.destination);
  src.start();
 }catch(e){}
}

function sound(type){
 if(type==="dice"){
  tone(300,.15);setTimeout(()=>tone(500,.13),100);
 }
 if(type==="walk")tone(120,.06,"triangle",.07);
 if(type==="exit")tone(420,.18);
 if(type==="monster"){
  tone(100,.5,"sawtooth",.2);
  setTimeout(()=>tone(65,.45,"sawtooth",.15),180);
 }
 if(type==="spear"){
  tone(170,.18,"sawtooth");
  setTimeout(()=>tone(390,.25,"triangle"),130);
  setTimeout(()=>tone(100,.4,"sawtooth"),250);
 }
 if(type==="boom")noise(.45,.25);
 if(type==="star"){
  tone(700,.18);setTimeout(()=>tone(1000,.25),120);
 }
 if(type==="rocket"){
  tone(220,.4,"sawtooth");
  setTimeout(()=>noise(.3,.2),250);
 }
 if(type==="win"){
  [440,550,660,880].forEach((n,i)=>setTimeout(()=>tone(n,.4),i*180));
 }
}

let music=false;
function startMusic(){
 if(music||!soundOn)return;
 music=true;
 const notes=[196,247,294,247,220,262,330,294];
 let n=0;
 musicTimer=setInterval(()=>{
  if(!soundOn||!audio)return;
  tone(notes[n++%notes.length],.28,"sine",.025);
 },550);
}

/* GAME */

function ui(){
 document.getElementById("turn").textContent=
  "Navbat: "+names[current];

 document.getElementById("status").textContent=
  dice===null?"Zarni tashlang":"Zar: "+dice+" — jangchini tanlang";

 document.getElementById("roll").disabled=
  dice!==null||busy||gameOver;

 document.getElementById("scores").innerHTML=
  names.map((n,i)=>
   `<span style="color:${light[i]}">${n}: ${states[i].filter(s=>s.done).length}/4</span><br>`
  ).join("");
}

function nextTurn(extra=false){
 dice=null;
 if(!extra)current=(current+1)%4;
 ui();
}

function toast(text){
 // Xabar doskaga chizilmaydi
 document.getElementById("status").textContent=text;
}

document.getElementById("roll").onclick=()=>{
 if(busy||dice!==null||gameOver)return;

 initAudio();
 startMusic();
 sound("dice");

 dice=1+Math.floor(Math.random()*6);
 document.getElementById("dice").textContent=
  ["⚀","⚁","⚂","⚃","⚄","⚅"][dice-1];

 const possible=states[current].some(s=>
  !s.done&&(s.step<0?dice===6:s.step+dice<=56)
 );

 ui();

 if(!possible){
  setTimeout(()=>nextTurn(),700);
 }
};

function animateMove(w,from,to,done){
 const start=performance.now();
 const duration=190;

 function frame(now){
  const t=Math.min(1,(now-start)/duration);
  const k=t*t*(3-2*t);
  w.x=from.x+(to.x-from.x)*k;
  w.y=from.y+(to.y-from.y)*k-Math.sin(t*Math.PI)*U*.12;
  draw();

  if(t<1)requestAnimationFrame(frame);
  else done();
 }
 requestAnimationFrame(frame);
}

function makeExplosion(x,y){
 sound("boom");
 for(let i=0;i<20;i++){
  const a=Math.random()*Math.PI*2;
  const speed=1+Math.random()*3;
  particles.push({
   x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
   life:1,size:2+Math.random()*4,
   color:["#ffdf40","#ff692b","#ffffff"][i%3]
  });
 }
 const timer=setInterval(()=>{
  particles.forEach(p=>{
   p.x+=p.vx;p.y+=p.vy;p.life-=.06;
  });
  particles=particles.filter(p=>p.life>0);
  if(!particles.length)clearInterval(timer);
  draw();
 },30);
}

function monsterAttack(ci,j,done){
 const p=getPos(ci,states[ci][j],j);
 monster={x:p.x,y:p.y};
 sound("monster");
 const start=performance.now();
 function frame(now){
  const t=Math.min(1,(now-start)/1000);
  monster.y=p.y-Math.sin(t*Math.PI)*U*.8;
  draw();
  if(t<1)requestAnimationFrame(frame);
  else{
   monster=null;
   makeExplosion(p.x,p.y);
   done();
  }
 }
 requestAnimationFrame(frame);
}

function capture(vci,vj,done){
 const s=states[vci][vj];
 const p=getPos(vci,s,vj);
 sound("spear");
 const start=performance.now();

 function frame(now){
  const t=Math.min(1,(now-start)/700);
  draw();
  if(t<1)requestAnimationFrame(frame);
  else{
   makeExplosion(p.x,p.y);
   s.step=-1;
   draw();
   done();
  }
 }
 requestAnimationFrame(frame);
}

function victimAt(ci,step){
 if(step<0||step>=52)return null;
 const idx=(starts[ci]+step)%52;

 for(let oi=0;oi<4;oi++){
  if(oi===ci)continue;
  for(let j=0;j<4;j++){
   const s=states[oi][j];
   if(s.step>=0&&s.step<52&&
    (starts[oi]+s.step)%52===idx){
    return {ci:oi,j};
   }
  }
 }
 return null;
}

function moveWarrior(ci,j){
 if(busy||dice===null||ci!==current||gameOver)return;

 const s=states[ci][j];
 if(s.done)return;

 if(s.step<0&&dice!==6)return;
 if(s.step>=0&&s.step+dice>56)return;

 busy=true;
 const w={...getPos(ci,s,j)};
 const from=s.step<0?-1:s.step;
 const target=from<0?0:from+dice;
 let step=from;

 animation={ci,j};

 function finish(){
  animation=null;
  busy=false;
  draw();
  ui();
 }

 function finishTurn(){
  if(s.step===56){
   s.done=true;
   sound("win");
   if(states[ci].every(x=>x.done)){
    gameOver=true;
    toast(names[ci]+" G‘OLIB!");
    finish();
    return;
   }
  }

  if(!s.done&&s.step<52){
   const idx=(starts[ci]+s.step)%52;

   if(traps.includes(idx)){
    monsterAttack(ci,j,()=>{
     s.step=-1;
     finish();
     nextTurn(dice===6);
    });
    return;
   }

   if(rockets.includes(idx)){
    sound("rocket");
    s.step=Math.min(56,s.step+5);
   }

   if(stars.includes(idx)){
    sound("star");
    finish();
    dice=null;
    ui();
    return;
   }
  }

  finish();
  nextTurn(dice===6);
 }

 function advance(){
  if(step>=target){
   s.step=target;
   if(target===56){finishTurn();return;}

   const v=victimAt(ci,target);
   if(v){
    capture(v.ci,v.j,finishTurn);
   }else finishTurn();
   return;
  }

  step++;
  s.step=step;
  const p=getPos(ci,s,j);
  const old={...w};
  const to={x:p.x,y:p.y};

  sound("walk");
  animateMove(w,old,to,()=>{
   w.x=to.x;w.y=to.y;
   advance();
  });
 }
 advance();
}

canvas.addEventListener("pointerdown",e=>{
 if(busy||dice===null||gameOver)return;
 const rect=canvas.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;

 let best=null,dist=Infinity;
 for(const p of positions){
  if(p.ci!==current)continue;
  const d=Math.hypot(p.x-x,p.y-y);
  if(d<dist){dist=d;best=p;}
 }
 if(best&&dist<U*1.5)moveWarrior(best.ci,best.j);
});

document.getElementById("sound").onclick=()=>{
 soundOn=!soundOn;
 document.getElementById("sound").textContent=soundOn?"♫":"🔇";
 if(!soundOn){
  clearInterval(musicTimer);
  music=false;
 }else{
  initAudio();startMusic();
 }
};

function orientation(){
 const portrait=innerHeight>innerWidth;
 document.getElementById("rotate").style.display=portrait?"flex":"none";
 document.getElementById("game").style.display=portrait?"none":"block";
 if(!portrait)resize();
}

addEventListener("resize",orientation);

ui();
orientation();

})();
</script>
