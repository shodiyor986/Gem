<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =================================
   1. SAHNA
================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101c2b);

const camera=new THREE.PerspectiveCamera(
 38,innerWidth/innerHeight,.1,150
);

camera.position.set(16,34,25);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;

document.getElementById("game").appendChild(renderer.domElement);

/* =================================
   2. YORUG'LIK
================================= */

scene.add(new THREE.HemisphereLight(
 0xdceaff,0x263a35,2.4
));

const sun=new THREE.DirectionalLight(0xffedcf,3.5);
sun.position.set(-12,25,15);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-22;
sun.shadow.camera.right=22;
sun.shadow.camera.top=22;
sun.shadow.camera.bottom=-22;
scene.add(sun);

const blueLight=new THREE.PointLight(0x348cff,30,35);
blueLight.position.set(8,9,-8);
scene.add(blueLight);

const goldLight=new THREE.PointLight(0xffc04d,22,30);
goldLight.position.set(-8,8,8);
scene.add(goldLight);

/* =================================
   3. MATERIALLAR
================================= */

function material(color,rough=.3,metal=.3){
 return new THREE.MeshPhysicalMaterial({
  color,
  roughness:rough,
  metalness:metal,
  clearcoat:.85,
  clearcoatRoughness:.13
 });
}

const colors=[
 {name:"Qizil",color:0xe33e48,start:0},
 {name:"Yashil",color:0x20b978,start:13},
 {name:"Ko‘k",color:0x3289ed,start:26},
 {name:"Sariq",color:0xeab83b,start:39}
];

const gold=material(0xe7c16c,.2,.85);
const darkMetal=material(0x253746,.3,.7);

/* =================================
   4. YER
================================= */

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(150,150),
 material(0x172b3b,.8,.15)
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.8;
floor.receiveShadow=true;
scene.add(floor);

/* =================================
   5. DOSKA
================================= */

const board=new THREE.Group();
scene.add(board);

const base=new THREE.Mesh(
 new THREE.BoxGeometry(14.8,.65,14.8),
 material(0x263e53,.24,.65)
);
base.position.y=-.3;
base.castShadow=true;
base.receiveShadow=true;
board.add(base);

// Oltin chetlar
for(let i=0;i<4;i++){
 const edge=new THREE.Mesh(
  new THREE.BoxGeometry(14.95,.11,.11),gold
 );
 if(i<2){
  edge.position.set(0,.08,i===0?-7.4:7.4);
 }else{
  edge.rotation.y=Math.PI/2;
  edge.position.set(i===2?-7.4:7.4,.08,0);
 }
 board.add(edge);
}

// Shisha markaziy sirt
const glass=new THREE.Mesh(
 new THREE.BoxGeometry(11.8,.045,11.8),
 new THREE.MeshPhysicalMaterial({
  color:0x35546d,
  roughness:.16,
  metalness:.38,
  transparent:true,
  opacity:.8,
  clearcoat:1
 })
);
glass.position.y=.045;
board.add(glass);

/* =================================
   6. YO'LAK
================================= */

const path=[];

// 52 ta katak, to'rt tomon
for(let side=0;side<4;side++){
 for(let i=0;i<13;i++){
  const t=-5.5+i*(11/12);

  if(side===0)path.push([t,-6]);
  if(side===1)path.push([6,t]);
  if(side===2)path.push([-t,6]);
  if(side===3)path.push([-6,-t]);
 }
}

const traps=[5,18,31,44];
const rockets=[9,22,35,48];
const stars=[2,15,28,41];

path.forEach((p,i)=>{

 let color=0xe4eaf0;

 if(traps.includes(i))color=0x8f343c;
 if(rockets.includes(i))color=0x246cb0;
 if(stars.includes(i))color=0xb88c2f;

 const tile=new THREE.Mesh(
  new THREE.BoxGeometry(.89,.17,.89),
  material(color,.2,.4)
 );

 tile.position.set(p[0],.13,p[1]);
 tile.castShadow=true;
 tile.receiveShadow=true;
 board.add(tile);

 // Tuzoq
 if(traps.includes(i)){
  const hole=new THREE.Mesh(
   new THREE.CylinderGeometry(.25,.29,.08,32),
   material(0x10151b,.9,.1)
  );
  hole.position.set(p[0],.25,p[1]);
  board.add(hole);

  const rim=new THREE.Mesh(
   new THREE.TorusGeometry(.25,.045,10,24),
   material(0xc66b52,.25,.7)
  );
  rim.position.set(p[0],.3,p[1]);
  board.add(rim);
 }

 // Raketa
 if(rockets.includes(i)){
  const rocket=new THREE.Group();

  const rb=new THREE.Mesh(
   new THREE.CylinderGeometry(.105,.13,.4,16),
   material(0xc9d6e4,.2,.8)
  );

  const rn=new THREE.Mesh(
   new THREE.ConeGeometry(.13,.22,16),
   material(0xe64c36,.2,.5)
  );
  rn.position.y=.3;
  rocket.add(rb,rn);

  const flame=new THREE.Mesh(
   new THREE.ConeGeometry(.08,.25,12),
   material(0xffa02d)
  );
  flame.position.y=-.3;
  flame.rotation.z=Math.PI;
  rocket.add(flame);

  rocket.position.set(p[0],.5,p[1]);
  board.add(rocket);
 }

 // Yulduz
 if(stars.includes(i)){
  const star=new THREE.Mesh(
   new THREE.OctahedronGeometry(.24),
   gold
  );
  star.position.set(p[0],.48,p[1]);
  board.add(star);
 }
});

/* =================================
   7. UYLAR
================================= */

const homes=[
 [-4.4,-4.4],
 [4.4,-4.4],
 [4.4,4.4],
 [-4.4,4.4]
];

homes.forEach((p,i)=>{

 const house=new THREE.Mesh(
  new THREE.BoxGeometry(3.15,.25,3.15),
  material(colors[i].color,.24,.55)
 );
 house.position.set(p[0],.12,p[1]);
 house.castShadow=true;
 board.add(house);

 const inner=new THREE.Mesh(
  new THREE.BoxGeometry(2.55,.12,2.55),
  material(0x293c4c,.2,.55)
 );
 inner.position.set(p[0],.3,p[1]);
 board.add(inner);

 for(let j=0;j<4;j++){
  const x=p[0]+(j%2?.65:-.65);
  const z=p[1]+(j<2?-.65:.65);

  const ring=new THREE.Mesh(
   new THREE.CylinderGeometry(.39,.39,.1,32),
   material(0xd7c69c,.2,.6)
  );
  ring.position.set(x,.42,z);
  board.add(ring);
 }
});

/* =================================
   8. FINISH YO'LAKLARI
================================= */

const finishLanes=[];

for(let ci=0;ci<4;ci++){

 // Jangchi aylanishni tugatgan katak
 const entry=path[(colors[ci].start+51)%52];

 const lane=[];

 // 4 ta oraliq katak va markaziy finish
 for(let i=1;i<=5;i++){
  const t=i/5;

  lane.push([
   entry[0]*(1-t),
   entry[1]*(1-t)
  ]);
 }

 finishLanes.push(lane);

 lane.forEach((p,index)=>{

  const tile=new THREE.Mesh(
   new THREE.BoxGeometry(.94,.2,.94),
   material(colors[ci].color,.2,.65)
  );

  tile.position.set(p[0],.27,p[1]);
  tile.castShadow=true;
  tile.receiveShadow=true;
  board.add(tile);

  // Finish yo'lagi yaltirashi
  const light=new THREE.PointLight(
   colors[ci].color,.5,2
  );
  light.position.set(p[0],.65,p[1]);
  board.add(light);
 });
}

// Markaziy finish
const finishBase=new THREE.Mesh(
 new THREE.CylinderGeometry(1.35,1.55,.34,8),
 material(0xd5a33f,.17,.8)
);
finishBase.position.y=.4;
finishBase.castShadow=true;
board.add(finishBase);

const finishInner=new THREE.Mesh(
 new THREE.CylinderGeometry(.9,1.05,.12,8),
 material(0xffe0a0,.15,.65)
);
finishInner.position.y=.62;
board.add(finishInner);

const finishGem=new THREE.Mesh(
 new THREE.OctahedronGeometry(.45),
 material(0xffe6a2,.12,.9)
);
finishGem.position.y=1;
board.add(finishGem);

function finishLane(ci,step){
 return finishLanes[ci][step-52];
}

/* =================================
   9. JANGCHI MODELI
================================= */

function createWarrior(ci){

 const root=new THREE.Group();

 const armor=material(colors[ci].color,.2,.7);
 const skin=material(0xb98767,.7,.05);

 const torso=new THREE.Mesh(
  new THREE.CylinderGeometry(.23,.31,.65,20),
  armor
 );
 torso.position.y=.85;
 root.add(torso);

 const chest=new THREE.Mesh(
  new THREE.BoxGeometry(.4,.25,.12),
  gold
 );
 chest.position.set(0,.94,.25);
 root.add(chest);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.22,24,20),
  skin
 );
 head.position.y=1.35;
 root.add(head);

 const helmet=new THREE.Mesh(
  new THREE.SphereGeometry(.26,24,18),
  gold
 );
 helmet.scale.y=.7;
 helmet.position.y=1.45;
 root.add(helmet);

 const crest=new THREE.Mesh(
  new THREE.ConeGeometry(.1,.36,10),
  material(0xa72e3a,.2,.5)
 );
 crest.position.y=1.69;
 root.add(crest);

 const legs=[];
 const arms=[];

 for(const side of [-1,1]){

  const leg=new THREE.Group();
  leg.position.set(side*.13,.5,0);

  const lm=new THREE.Mesh(
   new THREE.CylinderGeometry(.09,.12,.42,14),
   darkMetal
  );
  lm.position.y=-.2;
  leg.add(lm);
  root.add(leg);
  legs.push(leg);

  const arm=new THREE.Group();
  arm.position.set(side*.28,1.05,0);

  const am=new THREE.Mesh(
   new THREE.CylinderGeometry(.075,.1,.42,14),
   armor
  );
  am.position.y=-.18;
  arm.add(am);
  root.add(arm);
  arms.push(arm);
 }

 // Qalqon
 const shield=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.25,.09,8),
  gold
 );
 shield.rotation.x=Math.PI/2;
 shield.position.set(-.43,.85,.08);
 root.add(shield);

 // Nayza
 const spear=new THREE.Group();

 const shaft=new THREE.Mesh(
  new THREE.CylinderGeometry(.025,.04,1.25,12),
  material(0x765334,.3,.5)
 );
 shaft.position.y=.65;
 spear.add(shaft);

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(.1,.32,10),
  gold
 );
 tip.position.y=1.42;
 spear.add(tip);

 spear.position.set(.37,.05,0);
 root.add(spear);

 const foot=new THREE.Mesh(
  new THREE.CylinderGeometry(.34,.34,.12,24),
  darkMetal
 );
 foot.position.y=.06;
 root.add(foot);

 root.userData={
  legs,arms,spear
 };

 root.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 return root;
}

/* =================================
   10. 16 JANGCHI
================================= */

const warriors=[];
const states=[];

for(let ci=0;ci<4;ci++){

 warriors[ci]=[];
 states[ci]=[];

 for(let j=0;j<4;j++){

  const w=createWarrior(ci);
  board.add(w);

  warriors[ci].push(w);
  states[ci].push({
   step:-1,
   done:false
  });
 }
}

function homePosition(ci,j){
 const p=homes[ci];

 return [
  p[0]+(j%2?.65:-.65),
  p[1]+(j<2?-.65:.65)
 ];
}

function globalIndex(ci,step){
 return (colors[ci].start+step)%52;
}

function getPosition(ci,s,j){

 if(s.step<0)return homePosition(ci,j);

 if(s.step>=56)return [0,0];

 if(s.step>=52)return finishLane(ci,s.step);

 return path[globalIndex(ci,s.step)];
}

function updatePositions(){

 for(let ci=0;ci<4;ci++){
  for(let j=0;j<4;j++){

   const s=states[ci][j];
   const p=getPosition(ci,s,j);

   warriors[ci][j].position.set(
    p[0],.22,p[1]
   );
  }
 }
}

/* =================================
   11. OVOZ
================================= */

let audio=null;

function sound(type){

 try{

  audio ||= new (
   window.AudioContext||
   window.webkitAudioContext
  )();

  if(audio.state==="suspended")audio.resume();

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.connect(gain);
  gain.connect(audio.destination);

  const now=audio.currentTime;

  const cfg={
   dice:[250,.15],
   walk:[130,.07],
   spear:[110,.3],
   boom:[65,.55],
   rocket:[450,.35],
   star:[880,.3],
   trap:[75,.4]
  }[type]||[200,.1];

  osc.frequency.setValueAtTime(cfg[0],now);
  osc.frequency.exponentialRampToValueAtTime(
   Math.max(30,cfg[0]*.3),now+cfg[1]
  );

  gain.gain.setValueAtTime(.001,now);
  gain.gain.linearRampToValueAtTime(.15,now+.02);
  gain.gain.exponentialRampToValueAtTime(.001,now+cfg[1]);

  osc.start(now);
  osc.stop(now+cfg[1]+.03);

 }catch(e){}
}

/* =================================
   12. O'YIN HOLATI
================================= */

let current=0;
let dice=null;
let busy=false;

const all=warriors.flat();
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function toast(text){

 const el=document.getElementById("toast");
 el.textContent=text;
 el.style.opacity=1;

 clearTimeout(toast.timer);

 toast.timer=setTimeout(()=>{
  el.style.opacity=0;
 },1900);
}

function updateUI(){

 document.getElementById("turn").textContent=
  "Navbat: "+colors[current].name;

 document.getElementById("status").textContent=
  dice===null?"Zarni tashlang":"Zar: "+dice+" — jangchini tanlang";

 document.getElementById("roll").disabled=
  dice!==null||busy;

 document.getElementById("scores").innerHTML=
  colors.map((c,i)=>
   `<span style="color:#${c.color.toString(16)}">${c.name}: ${states[i].filter(x=>x.done).length}/4</span><br>`
  ).join("");
}

function nextTurn(extra=false){

 dice=null;

 if(!extra)current=(current+1)%4;

 updateUI();
}

/* =================================
   13. ZAR TASHLASH
================================= */

document.getElementById("roll").onclick=()=>{

 if(busy||dice!==null)return;

 sound("dice");

 dice=1+Math.floor(Math.random()*6);

 document.getElementById("dice").textContent=
  ["⚀","⚁","⚂","⚃","⚄","⚅"][dice-1];

 const possible=states[current].some(s=>
  !s.done&&(
   s.step<0?dice===6:s.step+dice<=56
  )
 );

 updateUI();

 if(!possible){
  toast("Bu yurishda mos jangchi yo‘q!");
  setTimeout(()=>nextTurn(),900);
 }
};

/* =================================
   14. PORTLASH EFFEKTI
================================= */

function explosion(pos){

 sound("boom");

 const group=new THREE.Group();
 group.position.copy(pos);
 board.add(group);

 const particles=[];
 const mats=[
  material(0xffd24b),
  material(0xff682c),
  material(0xffffff)
 ];

 for(let i=0;i<36;i++){

  const m=new THREE.Mesh(
   new THREE.SphereGeometry(.075+Math.random()*.07,8,8),
   mats[i%3]
  );

  group.add(m);

  particles.push({
   mesh:m,
   velocity:new THREE.Vector3(
    (Math.random()-.5)*.3,
    Math.random()*.28,
    (Math.random()-.5)*.3
   )
  });
 }

 const start=performance.now();

 function animate(now){

  const t=(now-start)/750;

  particles.forEach(p=>{
   p.mesh.position.add(p.velocity);
   p.mesh.scale.setScalar(Math.max(.01,1-t));
  });

  if(t<1){
   requestAnimationFrame(animate);
  }else{
   board.remove(group);
  }
 }

 requestAnimationFrame(animate);
}

/* =================================
   15. MAXLUQ
================================= */

function monsterAttack(w,done){

 const monster=new THREE.Group();

 const monsterMat=material(0x354b3c,.25,.55);
 const eyeMat=new THREE.MeshBasicMaterial({
  color:0xff3322
 });

 const body=new THREE.Mesh(
  new THREE.SphereGeometry(.52,24,20),
  monsterMat
 );
 body.scale.set(1,1.35,.85);
 body.position.y=.65;
 monster.add(body);

 const mouth=new THREE.Mesh(
  new THREE.BoxGeometry(.35,.12,.12),
  material(0x101010)
 );
 mouth.position.set(0,.55,.45);
 monster.add(mouth);

 for(const side of [-1,1]){

  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(.1,16,16),
   eyeMat
  );
  eye.position.set(side*.19,1,.37);
  monster.add(eye);

  const horn=new THREE.Mesh(
   new THREE.ConeGeometry(.13,.42,12),
   gold
  );
  horn.position.set(side*.34,1.35,0);
  monster.add(horn);
 }

 monster.position.set(
  w.position.x,-1.1,w.position.z
 );

 board.add(monster);

 const start=performance.now();

 function emerge(now){

  const t=Math.min(1,(now-start)/850);

  monster.position.y=-1.1+1.7*t;
  monster.rotation.z=Math.sin(t*5)*.08;

  if(t<1){
   requestAnimationFrame(emerge);
   return;
  }

  sound("trap");

  const swallowStart=performance.now();

  function swallow(time){

   const k=Math.min(1,(time-swallowStart)/650);

   w.position.y=.22+1.1*k;
   w.scale.setScalar(1-.9*k);

   if(k<1){
    requestAnimationFrame(swallow);
   }else{

    board.remove(monster);

    w.scale.setScalar(1);
    w.position.y=.22;

    done();
   }
  }

  requestAnimationFrame(swallow);
 }

 requestAnimationFrame(emerge);
}

/* =================================
   16. NAYZA JANGI
================================= */

function capture(victimTeam,victimIndex,attackerTeam,attackerIndex,done){

 const victim=warriors[victimTeam][victimIndex];
 const attacker=warriors[attackerTeam][attackerIndex];

 const spear=attacker.userData.spear;

 const dx=victim.position.x-attacker.position.x;
 const dz=victim.position.z-attacker.position.z;

 const oldRotation=attacker.rotation.y;

 attacker.rotation.y=Math.atan2(dx,dz);

 sound("spear");

 const original=spear.position.clone();
 const start=performance.now();

 function attack(now){

  const t=Math.min(1,(now-start)/1300);

  // Nayza zarbasi
  if(t<.35){

   const k=t/.35;

   spear.position.z=original.z-.9*k;
   victim.position.y=.22+Math.sin(k*Math.PI)*.3;
  }

  // Jangchi yuqoriga ko‘tariladi
  else{

   const k=(t-.35)/.65;

   spear.position.z=original.z-.9+1.0*k;
   victim.position.y=.22+1.45*k;
   victim.rotation.z=.35*k;
  }

  if(t<1){
   requestAnimationFrame(attack);
  }else{

   spear.position.copy(original);
   attacker.rotation.y=oldRotation;

   victim.rotation.set(0,0,0);
   victim.scale.setScalar(1);

   explosion(victim.position.clone());

   states[victimTeam][victimIndex].step=-1;
   updatePositions();

   done();
  }
 }

 requestAnimationFrame(attack);
}

/* =================================
   17. YURISH ANIMATSIYASI
================================= */

function animateWalk(w,from,to,done){

 const start=performance.now();
 const duration=190;

 const legs=w.userData.legs;
 const arms=w.userData.arms;

 sound("walk");

 function animate(now){

  const t=Math.min(1,(now-start)/duration);

  w.position.lerpVectors(from,to,t);
  w.position.y=.22+Math.abs(Math.sin(t*Math.PI*2))*.12;

  legs.forEach((l,i)=>{
   l.rotation.x=Math.sin(t*Math.PI*4+i*Math.PI)*.6;
  });

  arms.forEach((a,i)=>{
   a.rotation.x=Math.sin(t*Math.PI*4+i*Math.PI)*.4;
  });

  if(t<1){
   requestAnimationFrame(animate);
  }else{

   w.position.copy(to);
   w.position.y=.22;

   legs.forEach(l=>l.rotation.x=0);
   arms.forEach(a=>a.rotation.x=0);

   done();
  }
 }

 requestAnimationFrame(animate);
}

/* =================================
   18. RAQIBNI TOPISH
================================= */

function findVictim(ci,step){

 if(step<0||step>=52)return null;

 const idx=globalIndex(ci,step);

 for(let oi=0;oi<4;oi++){

  if(oi===ci)continue;

  for(let oj=0;oj<4;oj++){

   const s=states[oi][oj];

   if(
    !s.done&&
    s.step>=0&&
    s.step<52&&
    globalIndex(oi,s.step)===idx
   ){
    return {team:oi,index:oj};
   }
  }
 }

 return null;
}

/* =================================
   19. JANGCHI YURISHI
================================= */

function moveWarrior(ci,j){

 if(busy||dice===null||ci!==current)return;

 const s=states[ci][j];

 if(s.done)return;

 if(s.step<0&&dice!==6){
  toast("Jangchini chiqarish uchun 6 kerak!");
  return;
 }

 // Finishdan ortib ketmaslik
 if(s.step>=0&&s.step+dice>56){
  toast("Finish uchun aniq son kerak!");
  return;
 }

 busy=true;

 const target=s.step<0?0:s.step+dice;
 let step=s.step<0?-1:s.step;

 const w=warriors[ci][j];

 function finishGame(){

  s.done=true;
  w.position.set(0,.65,0);

  busy=false;

  toast("🏆 Jangchi marraga yetdi!");

  if(states[ci].every(x=>x.done)){
   toast("🏆 "+colors[ci].name+" G‘OLIB!");
   dice=null;
   updateUI();
  }else{
   nextTurn(dice===6);
  }
 }

 function finishMove(){

  // Finishga yetish
  if(s.step===56){
   finishGame();
   return;
  }

  const idx=s.step<52?globalIndex(ci,s.step):-1;

  // Tuzoq
  if(traps.includes(idx)){

   toast("👹 Maxluq jangchini yutmoqda!");

   monsterAttack(w,()=>{

    s.step=-1;
    updatePositions();

    busy=false;
    nextTurn(dice===6);
   });

   return;
  }

  // Raketa
  if(rockets.includes(idx)){

   sound("rocket");
   toast("🚀 Raketa! 5 qadam oldinga!");

   s.step=Math.min(56,s.step+5);
   updatePositions();

   if(s.step===56){
    finishGame();
    return;
   }
  }

  // Yulduzcha
  if(stars.includes(idx)){

   sound("star");
   toast("⭐ Yulduzcha! Yana bir yurish!");

   updatePositions();

   busy=false;
   dice=null;
   updateUI();
   return;
  }

  updatePositions();
  busy=false;

  if(states[ci].every(x=>x.done)){
   toast("🏆 G‘ALABA!");
   dice=null;
   updateUI();
  }else{
   nextTurn(dice===6);
  }
 }

 function oneStep(){

  if(step>=target){

   s.step=target;

   if(target===56){
    finishGame();
    return;
   }

   // Raqibni tekshirish
   const victim=findVictim(ci,target);

   if(victim){

    toast("⚔ Nayza hujumi!");

    capture(
     victim.team,
     victim.index,
     ci,
     j,
     finishMove
    );

   }else{
    finishMove();
   }

   return;
  }

  step++;

  const p=step>=52
   ?finishLane(ci,step)
   :path[globalIndex(ci,step)];

  const from=w.position.clone();

  const to=new THREE.Vector3(
   p[0],.22,p[1]
  );

  // Finish yo‘lagi avtomatik ochiladi
  animateWalk(w,from,to,oneStep);
 }

 oneStep();
}

/* =================================
   20. JANGCHINI BOSISH
================================= */

renderer.domElement.addEventListener(
 "pointerdown",e=>{

  if(busy||dice===null)return;

  const rect=renderer.domElement.getBoundingClientRect();

  pointer.x=
   (e.clientX-rect.left)/rect.width*2-1;

  pointer.y=
   -(e.clientY-rect.top)/rect.height*2+1;

  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObjects(all,true);

  if(!hits.length)return;

  let node=hits[0].object;

  while(node&&!all.includes(node)){
   node=node.parent;
  }

  if(node){

   const n=all.indexOf(node);

   moveWarrior(
    Math.floor(n/4),
    n%4
   );
  }
});

/* =================================
   21. KAMERA
================================= */

function resize(){

 camera.aspect=innerWidth/innerHeight;

 camera.position.set(
  0,
  innerWidth<650?38:31,
  innerWidth<650?30:23
 );

 camera.lookAt(0,0,0);
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}

addEventListener("resize",resize);
resize();

/* =================================
   22. YAKUNIY ANIMATSIYA
================================= */

const clock=new THREE.Clock();

function render(){

 requestAnimationFrame(render);

 const t=clock.getElapsedTime();

 finishGem.rotation.y=t*.65;
 finishGem.position.y=1+Math.sin(t*2)*.12;

 renderer.render(scene,camera);
}

updatePositions();
updateUI();
render();

</script>
