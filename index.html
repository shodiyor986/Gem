
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c2b">
<title>Ludo Warriors 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071c2b;font-family:Arial,sans-serif;color:#fff;touch-action:manipulation}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#landscape{position:fixed;inset:0;z-index:10;background:linear-gradient(145deg,#09273b,#06121e);display:none;align-items:center;justify-content:center;text-align:center;padding:25px}
#landscape .box{max-width:360px;background:#102e45;border:2px solid #d6b45c;border-radius:20px;padding:24px;box-shadow:0 10px 40px #0008}
#landscape .phone{font-size:48px;margin-bottom:10px}
#landscape button{margin-top:15px}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:10px}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.panel{background:#09243be8;border:2px solid #ffffff65;border-radius:15px;padding:9px 13px;box-shadow:0 4px 15px #0005;backdrop-filter:blur(5px)}
#brand{font-weight:900;color:#ffdc80;font-size:clamp(13px,2vw,20px)}
#turn{font-size:clamp(12px,1.7vw,17px);margin-top:5px}
#status{font-size:clamp(10px,1.4vw,14px);margin-top:3px;color:#d3e7f5}
#scores{font-size:clamp(10px,1.4vw,14px);line-height:1.65;text-align:right}
#bottom{display:flex;justify-content:center;align-items:end;gap:10px;pointer-events:none}
#hint{font-size:clamp(10px,1.3vw,13px);max-width:50%;line-height:1.4}
#controls{display:flex;align-items:center;gap:9px;pointer-events:auto}
button{border:2px solid #ffe6a6;border-radius:14px;padding:12px 20px;font-weight:900;font-size:clamp(12px,1.5vw,16px);color:#1b2630;background:linear-gradient(135deg,#fff0b8,#d49a35);box-shadow:0 4px 12px #0005;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45}
#dice{font-size:30px;min-width:58px;text-align:center;padding:5px 10px}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#09243bf2;border:2px solid #ffe09a;border-radius:14px;padding:12px 18px;font-weight:bold;opacity:0;transition:opacity .2s;text-align:center;max-width:80%;font-size:clamp(12px,1.8vw,18px)}
@media(orientation:portrait){
#landscape{display:flex}
#hud{display:none}
}
</style>
</head>
<body>

<div id="game"></div>

<div id="landscape">
<div class="box">
<div class="phone">📱 ↻</div>
<h2>Telefonni yonboshlating</h2>
<p>O‘yin to‘g‘ri ko‘rinishi va doska to‘liq sig‘ishi uchun telefonni gorizontal holatga o‘tkazing.</p>
<button id="rotateBtn">GORIZONTAL HOLATDA O‘YNASH</button>
</div>
</div>

<div id="hud">
<div id="top">
<div class="panel">
<div id="brand">⚔ LUDO WARRIORS 3D</div>
<div id="turn">Navbat: Qizil</div>
<div id="status">Zarni tashlang</div>
</div>
<div class="panel" id="scores"></div>
</div>

<div id="bottom">
<div class="panel" id="hint">Jangchini tanlang va yurishni boshlang!</div>
<div id="controls">
<div class="panel" id="dice">🎲</div>
<button id="roll">ZAR TASHLA</button>
</div>
</div>
<div id="toast"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const IMG='ludo_board.png';

const mount=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x071c2b);

const camera=new THREE.OrthographicCamera(-8,8,5.333,-5.333,.1,80);
camera.position.set(0,22,0);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
antialias:false,
alpha:false,
powerPreference:'low-power'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526070,2.0));

const sun=new THREE.DirectionalLight(0xffffff,2.0);
sun.position.set(-5,12,8);
scene.add(sun);

const loader=new THREE.TextureLoader();

loader.load(IMG,tex=>{
tex.colorSpace=THREE.SRGBColorSpace;
tex.anisotropy=1;

const board=new THREE.Mesh(
new THREE.PlaneGeometry(15,10),
new THREE.MeshBasicMaterial({map:tex})
);

board.rotation.x=-Math.PI/2;
board.position.y=0;
scene.add(board);
});

const palette=[
{name:'Qizil',hex:0xe83b45,start:13,home:[1270,420]},
{name:'Yashil',hex:0x22bd59,start:39,home:[260,420]},
{name:'Ko‘k',hex:0x2679ed,start:26,home:[770,860]},
{name:'Sariq',hex:0xf2c52d,start:0,home:[770,100]}
];

// Doska koordinatalari
const poly=[
[770,205],[1040,270],[1285,405],[1100,575],
[770,790],[445,575],[235,405],[500,270]
];

function sample(a,b,n){
let out=[];
for(let i=0;i<n;i++){
let t=i/n;
out.push([
a[0]+(b[0]-a[0])*t,
a[1]+(b[1]-a[1])*t
]);
}
return out;
}

let pix=[];
const counts=[7,6,7,6,7,6,7,6];

for(let i=0;i<8;i++){
pix.push(...sample(poly[i],poly[(i+1)%8],counts[i]));
}

function world(p){
return new THREE.Vector3(
(p[0]/1536-.5)*15,
.18,
(.5-p[1]/1024)*10
);
}

const path=pix.map(world);

const lanes=[
[[1285,405],[1220,430],[1155,455],[1090,480],[1025,505]],
[[235,405],[300,430],[365,455],[430,480],[495,505]],
[[770,790],[755,735],[740,680],[725,625],[710,570]],
[[770,205],[745,245],[720,285],[695,325],[670,365]]
].map(a=>a.map(world));

const homes=[
[[735,80],[800,80],[735,130],[800,130]],
[[220,385],[285,385],[220,445],[285,445]],
[[735,835],[800,835],[735,885],[800,885]],
[[1235,385],[1300,385],[1235,445],[1300,445]]
];

function mat(c,rough=.5,metal=.15){
return new THREE.MeshStandardMaterial({
color:c,roughness:rough,metalness:metal
});
}

const gold=mat(0xe9c46a,.3,.6);
const dark=mat(0x253344,.65,.1);

function warrior(ci){

const root=new THREE.Group();
const armor=mat(palette[ci].hex,.35,.35);
const skin=mat(0xe0ad83,.8,0);

const torso=new THREE.Mesh(
new THREE.BoxGeometry(.24,.43,.2),armor
);
torso.position.y=.48;
root.add(torso);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.14,10,8),skin
);
head.position.y=.82;
root.add(head);

const helmet=new THREE.Mesh(
new THREE.SphereGeometry(.17,10,8),gold
);
helmet.scale.y=.65;
helmet.position.y=.91;
root.add(helmet);

const crest=new THREE.Mesh(
new THREE.ConeGeometry(.07,.2,6),armor
);
crest.position.y=1.06;
root.add(crest);

for(let s of [-1,1]){

let leg=new THREE.Mesh(
new THREE.BoxGeometry(.09,.25,.11),dark
);
leg.position.set(s*.075,.14,0);
root.add(leg);

let arm=new THREE.Mesh(
new THREE.BoxGeometry(.08,.28,.09),armor
);
arm.position.set(s*.19,.51,0);
arm.rotation.z=s*.25;
root.add(arm);
}

const spear=new THREE.Group();

let shaft=new THREE.Mesh(
new THREE.CylinderGeometry(.018,.025,.65,6),dark
);
shaft.position.y=.34;
spear.add(shaft);

let tip=new THREE.Mesh(
new THREE.ConeGeometry(.065,.18,6),gold
);
tip.position.y=.75;
spear.add(tip);

spear.position.set(.24,.2,.02);
root.add(spear);

let shield=new THREE.Mesh(
new THREE.CylinderGeometry(.13,.13,.045,8),gold
);
shield.rotation.x=Math.PI/2;
shield.position.set(-.22,.47,.08);
root.add(shield);

root.userData={spear};

root.traverse(o=>{
if(o.isMesh){
o.castShadow=false;
o.receiveShadow=false;
}
});

return root;
}

const teams=palette.map((c,ci)=>
Array.from({length:4},()=>{
let w=warrior(ci);
scene.add(w);
return w;
})
);

const states=palette.map(()=>
Array.from({length:4},()=>({
step:-1,
done:false
}))
);

function pos(ci,j,s){

if(s.step<0){
let p=world(homes[ci][j]);
p.y=.18;
return p;
}

if(s.step>=52)
return lanes[ci][Math.min(4,s.step-52)].clone();

return path[(palette[ci].start+s.step)%52].clone();
}

function arrange(){

for(let c=0;c<4;c++)
for(let j=0;j<4;j++){
let p=pos(c,j,states[c][j]);
teams[c][j].position.copy(p);
}
}

let current=0;
let dice=null;
let busy=false;
let won=false;

const ray=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function say(t){

let el=document.getElementById('toast');
el.textContent=t;
el.style.opacity=1;

clearTimeout(say.timer);

say.timer=setTimeout(()=>{
el.style.opacity=0;
},1700);
}

let audio;

function sound(f=220,d=.12,type='sine'){

try{

audio ||=new (
window.AudioContext||window.webkitAudioContext
)();

if(audio.state==='suspended')audio.resume();

let o=audio.createOscillator();
let g=audio.createGain();

o.type=type;
o.frequency.setValueAtTime(f,audio.currentTime);

o.frequency.exponentialRampToValueAtTime(
Math.max(35,f*.45),
audio.currentTime+d
);

g.gain.setValueAtTime(.001,audio.currentTime);
g.gain.linearRampToValueAtTime(.11,audio.currentTime+.015);
g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);

o.connect(g);
g.connect(audio.destination);

o.start();
o.stop(audio.currentTime+d+.02);

}catch(e){}
}

function ui(){

document.getElementById('turn').textContent=
'Navbat: '+palette[current].name;

document.getElementById('status').textContent=
dice===null?'Zarni tashlang':'Zar: '+dice+' — jangchini bosing';

document.getElementById('roll').disabled=
dice!==null||busy||won;

document.getElementById('scores').innerHTML=
palette.map((p,i)=>
`<span style="color:#${p.hex.toString(16)}">${p.name}: ${states[i].filter(s=>s.done).length}/4</span>`
).join('<br>');
}

function next(extra=false){

dice=null;

if(!extra)current=(current+1)%4;

ui();
}

document.getElementById('roll').onclick=()=>{

if(busy||dice!==null||won)return;

sound(260,.18);

dice=1+Math.floor(Math.random()*6);

document.getElementById('dice').textContent=
['⚀','⚁','⚂','⚃','⚄','⚅'][dice-1];

let possible=states[current].some(s=>
!s.done&&(s.step<0?dice===6:s.step+dice<=56)
);

ui();

if(!possible){
say('Yurish imkoni yo‘q');
setTimeout(()=>next(),850);
}
};

function victimAt(ci,step){

if(step<0||step>=52)return null;

let idx=(palette[ci].start+step)%52;

for(let c=0;c<4;c++)
if(c!==ci)
for(let j=0;j<4;j++){

let s=states[c][j];

if(
!s.done&&
s.step>=0&&
s.step<52&&
(palette[c].start+s.step)%52===idx
){
return [c,j];
}
}

return null;
}

function animateTo(w,to,done){

let from=w.position.clone();
let start=performance.now();
let duration=230;

function tick(now){

let t=Math.min(1,(now-start)/duration);

w.position.lerpVectors(from,to,t);
w.position.y=.18+Math.sin(t*Math.PI)*.14;

if(t<1){
requestAnimationFrame(tick);
}else{
w.position.copy(to);
done();
}
}

requestAnimationFrame(tick);
}

function move(ci,j){

if(busy||dice===null||ci!==current||won)return;

let s=states[ci][j];

if(s.done)return;

if(s.step<0&&dice!==6){
say('Uydan chiqish uchun 6 kerak');
return;
}

if(s.step>=0&&s.step+dice>56){
say('Finish uchun aniq son kerak');
return;
}

busy=true;

let target=s.step<0?0:s.step+dice;
let step=s.step;

function finish(){

s.step=target;

if(target>=56){

s.done=true;
teams[ci][j].visible=false;

sound(880,.35);
say('🏆 Jangchi marraga yetdi!');

if(states[ci].every(x=>x.done)){

won=true;
sound(660,.5);

setTimeout(()=>{
say('🏆 '+palette[ci].name+' G‘OLIB!');
},500);

dice=null;
busy=false;
ui();
return;
}
}

let v=victimAt(ci,target);

if(v){

let [vc,vj]=v;
let enemy=teams[vc][vj];
let attacker=teams[ci][j];

say('⚔ Nayza hujumi!');
sound(150,.32,'sawtooth');

let spear=attacker.userData.spear;
let old=spear.rotation.x;

spear.rotation.x=-1.4;

setTimeout(()=>{

sound(90,.45,'triangle');

enemy.visible=false;
states[vc][vj].step=-1;
states[vc][vj].done=false;
enemy.visible=true;
enemy.scale.setScalar(.2);

setTimeout(()=>{

enemy.scale.setScalar(1);
arrange();
spear.rotation.x=old;

busy=false;
next(dice===6);

},350);

},420);

return;
}

busy=false;
next(dice===6);
}

function walk(){

if(step>=target){
finish();
return;
}

step++;

let p=step>=52
?lanes[ci][step-52].clone()
:path[(palette[ci].start+step)%52].clone();

animateTo(teams[ci][j],p,walk);
}

if(s.step<0){

step=-1;

let p=path[palette[ci].start].clone();

animateTo(teams[ci][j],p,()=>{

s.step=0;
finish();

});

}else{
walk();
}
}

renderer.domElement.addEventListener('pointerdown',e=>{

if(busy||dice===null)return;

let r=renderer.domElement.getBoundingClientRect();

pointer.x=(e.clientX-r.left)/r.width*2-1;
pointer.y=-(e.clientY-r.top)/r.height*2+1;

ray.setFromCamera(pointer,camera);

let flat=teams.flat();
let hits=ray.intersectObjects(flat,true);

if(!hits.length)return;

let n=hits[0].object;

while(n&&!flat.includes(n))
n=n.parent;

if(n){

let idx=flat.indexOf(n);
move(Math.floor(idx/4),idx%4);

}
});

function resize(){

let w=innerWidth;
let h=innerHeight;
let aspect=w/h;

let halfH=5.2;
let halfW=halfH*aspect;

if(halfW<7.7){
halfW=7.7;
halfH=halfW/aspect;
}

camera.left=-halfW;
camera.right=halfW;
camera.top=halfH;
camera.bottom=-halfH;

camera.updateProjectionMatrix();

renderer.setSize(w,h);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio||1,1.25)
);
}

window.addEventListener('resize',resize);

document.getElementById('rotateBtn').onclick=()=>{

try{
screen.orientation?.lock?.('landscape').catch(()=>{});
}catch(e){}

};

arrange();
resize();
ui();

function render(){

requestAnimationFrame(render);
renderer.render(scene,camera);

}

render();

</script>
</body>
</html>
