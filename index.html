<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a2c">
<title>3D Jangchilar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2c;color:white;font-family:system-ui,Arial;touch-action:manipulation}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,8px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;pointer-events:none}
.badge{background:#111827df;border:1px solid #ffffff35;border-radius:16px;padding:8px 13px;font-size:clamp(12px,2vw,17px);font-weight:850;box-shadow:0 4px 15px #0005}
#turn{display:flex;align-items:center;gap:8px}.dot{width:13px;height:13px;border-radius:50%;background:var(--team)}
#controls{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 13px);display:flex;gap:9px;align-items:end}
button{border:0;border-radius:16px;padding:12px 17px;font-weight:900;font-size:clamp(13px,2vw,16px);color:#fff;background:linear-gradient(#ffd45d,#df8c13);box-shadow:0 5px 0 #8a4d0b,0 8px 18px #0006}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4d0b}
button:disabled{opacity:.55;filter:grayscale(.4)}
#diceFace{font-size:22px;margin-right:5px}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:#101827f2}
.panel{max-width:390px;width:100%;padding:25px 22px;border-radius:24px;text-align:center;background:#25344c;border:1px solid #ffffff30;box-shadow:0 18px 55px #0009}
.panel h1{font-size:24px;margin:0 0 8px}.panel p{color:#dbe5f2;font-size:14px;line-height:1.5}
#start{background:linear-gradient(#82a5ff,#3d5bd3);box-shadow:0 5px 0 #263b8b}
#rotate{font-size:46px;margin:5px}
@media(orientation:portrait){#portrait{display:block!important}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="badge">⚔️ 3D JANGCHILAR</div>
 <div class="badge" id="turn"><span class="dot" id="dot"></span><span id="turnName">Yashil navbati</span></div>
</div>
<div id="controls"><button id="dice"><span id="diceFace">🎲</span>KUBIK TASHLASH</button></div>
<div id="overlay"><div class="panel">
 <div id="rotate">📱 ↻</div><h1>Telefonni yonboshlating</h1>
 <p>O‘yin gorizontal ekranda ishlaydi. Telefonni yonboshlatib, boshlash tugmasini bosing.</p>
 <p id="portrait" style="display:none;color:#ffdc83">Telefonni gorizontal holatga aylantiring.</p>
 <button id="start">▶ O‘YINNI BOSHLASH</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';
const COLORS=[
 {name:'Yashil',hex:0x16c65b,css:'#16c65b',dark:0x087d35},
 {name:'Qizil',hex:0xf02e36,css:'#f02e36',dark:0x991c25},
 {name:'Sariq',hex:0xffc51c,css:'#ffc51c',dark:0x987000},
 {name:'Ko‘k',hex:0x2388ff,css:'#2388ff',dark:0x174b9a}
];
// Teams are arranged around the four ends of the plus-shaped board.
const TEAMS=[
 {home:[-5.5,0],dir:[1,0],side:1},   // green, west -> centre
 {home:[5.5,0],dir:[-1,0],side:-1}, // red, east -> centre
 {home:[0,-5.5],dir:[0,1],side:1},  // yellow, north -> centre
 {home:[0,5.5],dir:[0,-1],side:-1}  // blue, south -> centre
];
let scene,camera,renderer,clock,raycaster,mouse;
let pawns=[],tiles=[],current=0,rolled=false,rollValue=0,busy=false,started=false;
const mount=document.getElementById('game');
const material=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={grass:material(0x69c52c),earth:material(0x98531f),stone:material(0x8d9aa8),wood:material(0xb77739),gold:material(0xffc52d,.3,.3),steel:material(0xaab8c8,.3,.6),dark:material(0x263343),skin:material(0xf1bd8a)};
function cube(parent,w,h,d,mat,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function ball(parent,r,mat,x,y,z){let o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),mat);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function cyl(parent,rt,rb,h,mat,x,y,z,n=12){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),mat);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x138de0);scene.fog=new THREE.Fog(0x138de0,19,31);
 camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,80);camera.position.set(8.5,13.5,9.5);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xe6f6ff,0x6a4a25,2.1));
 let sun=new THREE.DirectionalLight(0xfff0d2,2.4);sun.position.set(-6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 cube(scene,30,.5,30,material(0x168bd5),0,-.85,0);
 buildIsland();buildBoard();buildBases();makeTreasure();
 raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();clock=new THREE.Clock();
 renderer.domElement.addEventListener('pointerdown',tap);
 addEventListener('resize',resize);animate();refreshHUD();
}
function buildIsland(){
 // Plus-shaped floating landmass, with three tiles across every arm.
 const cells=[];
 for(let z=-6;z<=6;z++)for(let x=-6;x<=6;x++)if(Math.abs(x)<=1||Math.abs(z)<=1)cells.push([x,z]);
 cells.forEach(([x,z])=>{
  cube(scene,.98,.35,.98,M.earth,x,-.15,z);
  cube(scene,1.02,.14,1.02,M.grass,x,.08,z);
 });
 // Small stone edging around the central junction.
 cube(scene,3.05,.28,3.05,material(0x9ba7b1),0,.2,0);
 cube(scene,2.92,.16,2.92,material(0x5da82c),0,.39,0);
}
function pathFor(id){
 // Each player enters along one of the two outside lanes, then reaches
 // their own middle finish row. The three-wide arm is kept visibly clear.
 const t=TEAMS[id],out=[];
 for(let k=0;k<5;k++){
  const x=t.dir[0]*(-5+k),z=t.dir[1]*(-5+k);
  // The outer/side lane is the actual travel lane; centre lane is finish.
  out.push([x+t.side*(-t.dir[1]),z+t.side*t.dir[0]]);
 }
 for(let k=1;k<=4;k++)out.push([t.dir[0]*(-1+k*.0),t.dir[1]*(-1+k*.0)]); // replaced below with finish steps
 // finish row from inner edge into central goal
 out.splice(5);
 for(let k=1;k<=4;k++){
  let x=t.dir[0]*(-1+k*.25),z=t.dir[1]*(-1+k*.25);
  out.push([x,z]);
 }
 return out;
}
const paths=TEAMS.map((_,i)=>pathFor(i));
function buildBoard(){
 // Common path cells on the two side strips. Middle strips are the coloured finish lanes.
 TEAMS.forEach((t,id)=>{
  for(let k=0;k<5;k++){
   const x=t.dir[0]*(-6+k),z=t.dir[1]*(-6+k);
   for(let lane=-1;lane<=1;lane++){
    const px=x+(t.dir[1]*lane),pz=z-(t.dir[0]*lane);
    let c=material(0xc99b66);
    if(lane===0)c=material(COLORS[id].hex);
    if(k===0&&lane===0)c=material(COLORS[id].dark);
    cube(scene,.9,.19,.9,c,px,.28,pz);
   }
  }
  // Finish lane: coloured central row from the home-side edge toward the centre.
  for(let k=1;k<=4;k++){
   let x=t.dir[0]*(-1+k*.22),z=t.dir[1]*(-1+k*.22);
   cube(scene,.88,.2,.88,material(COLORS[id].hex),x,.31,z);
  }
  // Star tile on each arm's outer side.
  let sx=t.dir[0]*-4.5+t.dir[1]*1,sz=t.dir[1]*-4.5-t.dir[0]*1;
  cube(scene,.9,.21,.9,M.gold,sx,.31,sz);makeStar(sx,.43,sz);
 });
 // Make the central finish platform
 cyl(scene,1.08,1.25,.35,material(0x80502a),0,.53,0,8);
 cyl(scene,.8,.95,.15,M.gold,0,.78,0,8);
}
function makeStar(x,y,z){
 const sh=new THREE.Shape();for(let i=0;i<10;i++){let a=Math.PI/2+i*Math.PI/5,r=i%2?.12:.25,px=Math.cos(a)*r,py=Math.sin(a)*r;i?sh.lineTo(px,py):sh.moveTo(px,py)}sh.closePath();
 let mesh=new THREE.Mesh(new THREE.ShapeGeometry(sh),material(0xffffff));mesh.rotation.x=-Math.PI/2;mesh.position.set(x,y,z);scene.add(mesh);
}
function buildBases(){
 TEAMS.forEach((t,id)=>{
  const [x,z]=t.home,c=COLORS[id].hex;
  cube(scene,2.5,.55,2.5,M.earth,x,.03,z);
  cube(scene,2.62,.16,2.62,M.grass,x,.38,z);
  cube(scene,2.28,.25,2.28,material(0x8895a5),x,.57,z);
  cube(scene,2.05,.18,2.05,material(c),x,.79,z);
  // Four miniature soldiers, placed in a square inside the home.
  [[-.48,-.48],[.48,-.48],[-.48,.48],[.48,.48]].forEach((off,n)=>{
   const pawn=makePawn(id,n,x+off[0],z+off[1]);pawns.push(pawn);
  });
  // Flag poles
  [-1,1].forEach(side=>{
   cyl(scene,.035,.035,1.15,M.wood,x+side*1.02,1.38,z-1.02);
   let flag=new THREE.Mesh(new THREE.PlaneGeometry(.48,.3),material(c));flag.position.set(x+side*1.02+.2,1.78,z-1.02);scene.add(flag);
  });
 });
}
function makePawn(team,num,x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,.95,z);
 const c=material(COLORS[team].hex),d=material(COLORS[team].dark),helmet=material(0x8393a5,.3,.55);
 cyl(g,.22,.27,.48,c,0,.24,0);ball(g,.19,M.skin,0,.59,0);ball(g,.26,helmet,0,.78,0);
 cube(g,.34,.06,.13,d,0,.96,0);cube(g,.23,.09,.04,M.dark,0,.65,.2);
 cube(g,.16,.14,.22,M.dark,-.13,-.03,.05);cube(g,.16,.14,.22,M.dark,.13,-.03,.05);
 // Spear and shield
 const weapon=new THREE.Group();g.add(weapon);cyl(weapon,.028,.028,.9,M.wood,.3,.55,.12);let tip=new THREE.Mesh(new THREE.ConeGeometry(.09,.25,6),M.steel);tip.position.set(.3,1.12,.12);weapon.add(tip);
 cyl(g,.15,.15,.07,M.gold,-.28,.42,.13,8).rotation.z=Math.PI/2;
 const glow=new THREE.Mesh(new THREE.CircleGeometry(.48,24),new THREE.MeshBasicMaterial({color:COLORS[team].hex,transparent:true,opacity:0,side:THREE.DoubleSide}));glow.rotation.x=-Math.PI/2;glow.position.y=-.38;g.add(glow);
 g.userData={team,num,progress:-1,home:true,weapon,glow,base:{x,z},homeOffset:{x:x-TEAMS[team].home[0],z:z-TEAMS[team].home[1]},phase:Math.random()*6.28};
 return g;
}
function makeTreasure(){
 const g=new THREE.Group();scene.add(g);g.position.set(0,.9,0);
 cube(g,.8,.38,.62,material(0x7334b9,.35),0,0,0);cube(g,.86,.12,.68,M.gold,0,.23,0);cube(g,.1,.44,.7,M.gold,0,.08,0);
 ball(g,.08,material(0x36d5ff,.25,.5),0,.08,.36);
}
function posOf(p){
 const t=TEAMS[p.userData.team],pr=p.userData.progress;
 if(pr<0)return {x:p.userData.base.x,z:p.userData.base.z};
 if(pr<5){const x=t.dir[0]*(-5+pr),z=t.dir[1]*(-5+pr);return {x:x+t.dir[1]*(-t.side),z:z-t.dir[0]*(-t.side)}}
 const f=Math.min(1,(pr-4)/4);return {x:t.dir[0]*(-1+f),z:t.dir[1]*(-1+f)};
}
function setPos(p){let q=posOf(p);p.position.set(q.x,.95,q.z)}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.4))}
function refreshHUD(){
 document.getElementById('turnName').textContent=COLORS[current].name+' navbati';
 document.getElementById('dot').style.background=COLORS[current].css;
 document.getElementById('dice').disabled=busy||rolled;
 document.getElementById('dice').innerHTML=rolled?'🎲 '+rollValue+' — JANGCHINI TANLANG':'<span id="diceFace">🎲</span>KUBIK TASHLASH';
 pawns.forEach(p=>p.userData.glow.material.opacity=(p.userData.team===current&&p.userData.progress<0)?.5:0);
}
function tap(e){
 if(!started||busy||!rolled)return;
 const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;
 raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(pawns,true);if(!hits.length)return;
 let obj=hits[0].object;while(obj&&obj.userData.team===undefined&&obj.parent)obj=obj.parent;
 if(!obj||obj.userData.team!==current)return;
 if(obj.userData.progress<0&&rollValue!==6){return}
 if(obj.userData.progress>=0&&obj.userData.progress+rollValue>8)return;
 move(obj);
}
function roll(){
 if(!started||busy||rolled)return;
 rollValue=1+Math.floor(Math.random()*6);rolled=true;refreshHUD();
 const options=pawns.filter(p=>p.userData.team===current&&(p.userData.progress<0?rollValue===6:p.userData.progress+rollValue<=8));
 if(!options.length){setTimeout(nextTurn,850);return}
 if(options.length===1)setTimeout(()=>move(options[0]),400);
}
function move(p){
 if(busy||!rolled)return;busy=true;
 p.userData.progress=p.userData.progress<0?0:p.userData.progress+rollValue;
 const q=posOf(p);animateTo(p,q,()=>{
  // Safe stars do not trigger combat. Otherwise knock enemy back to its home.
  if(p.userData.progress<5){
   const enemy=pawns.find(v=>v!==p&&v.userData.team!==p.userData.team&&v.userData.progress>=0&&sameTile(posOf(v),q));
   if(enemy&&!isStar(q)){combat(p,enemy,finish)}
   else finish();
  }else finish();
 });
}
function sameTile(a,b){return Math.abs(a.x-b.x)<.08&&Math.abs(a.z-b.z)<.08}
function isStar(q){return (Math.abs(q.x)===4.5&&Math.abs(q.z)===1)||(Math.abs(q.z)===4.5&&Math.abs(q.x)===1)}
function animateTo(p,q,done){
 const from=p.position.clone(),to=new THREE.Vector3(q.x,.95,q.z),start=performance.now(),dur=520;
 function step(now){let f=Math.min(1,(now-start)/dur);p.position.lerpVectors(from,to,f);p.position.y=.95+Math.sin(f*Math.PI)*.3;if(f<1)requestAnimationFrame(step);else{p.position.copy(to);done()}}requestAnimationFrame(step);
}
function combat(attacker,victim,done){
 const weapon=attacker.userData.weapon;const begin=performance.now();
 function jab(now){let f=Math.min(1,(now-begin)/330);weapon.rotation.x=-Math.sin(f*Math.PI)*1.15;if(f<1)requestAnimationFrame(jab);else{
  weapon.rotation.x=0;const start=victim.position.clone(),t=performance.now();
  function pop(now2){let k=Math.min(1,(now2-t)/500);victim.position.y=.95+Math.sin(k*Math.PI)*1.7;victim.scale.setScalar(1-.8*k);
   if(k<1)requestAnimationFrame(pop);else{victim.userData.progress=-1;victim.scale.setScalar(1);setPos(victim);done()}}
  requestAnimationFrame(pop);
 }}requestAnimationFrame(jab);
}
function finish(){
 busy=false;rolled=false;
 if(rollValue!==6)current=(current+1)%4;
 refreshHUD();
}
function nextTurn(){busy=false;rolled=false;current=(current+1)%4;refreshHUD()}
function animate(){
 requestAnimationFrame(animate);if(!renderer)return;
 let t=clock.getElapsedTime();
 // Idle breathing and a subtle bob; current team gets a bright pulsing floor glow.
 pawns.forEach(p=>{
  const d=p.userData,active=d.team===current;
  p.position.y=.95+Math.sin(t*2.4+d.phase)*.045;
  p.rotation.y=Math.sin(t*1.2+d.phase)*.08;
  d.glow.material.opacity=active?(.24+.24*(.5+.5*Math.sin(t*4+d.phase))):0;
  d.glow.scale.setScalar(active?1.05+.08*Math.sin(t*4+d.phase):1);
  d.weapon.rotation.z=Math.sin(t*1.8+d.phase)*.045;
 });
 renderer.render(scene,camera);
}
document.getElementById('dice').addEventListener('click',roll);
document.getElementById('start').addEventListener('click',async()=>{
 try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
 try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
 started=true;document.getElementById('overlay').style.display='none';refreshHUD();
});
init();
})();
</script>
</body></html>
