
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUDO WARRIORS 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101923;color:white;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:10px;right:10px;pointer-events:none}
.panel{background:#101923dd;padding:12px;border-radius:12px}
button{pointer-events:auto;border:0;padding:14px 20px;border-radius:12px;background:linear-gradient(135deg,#ffe29a,#d99b35);font-weight:bold}
#roll{position:fixed;right:15px;top:15px}
#info{position:fixed;left:10px;top:10px}
#message{position:fixed;bottom:15px;left:10px;right:10px;text-align:center;background:#101923dd;padding:12px;border-radius:12px}
</style>
</head>
<body>

<div id="game"></div>
<div id="hud">
 <div id="info" class="panel">
  <b style="color:#f5c76b">⚔ LUDO WARRIORS 3D</b>
  <div id="turn">Navbat: Qizil</div>
  <div id="status">Zarni tashlang</div>
 </div>
 <button id="roll">🎲 ZAR TASHLA</button>
 <div id="message">Jangchini tanlash uchun uni bosing.</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101923);

const camera=new THREE.PerspectiveCamera(
45,innerWidth/innerHeight,0.1,100
);
camera.position.set(0,16,19);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;

document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x354050,2));

const light=new THREE.DirectionalLight(0xffe0aa,3);
light.position.set(-8,15,8);
light.castShadow=true;
scene.add(light);

const colors=[
 {name:"Qizil",color:0xe83d45,start:0},
 {name:"Yashil",color:0x24c779,start:13},
 {name:"Ko‘k",color:0x398cff,start:26},
 {name:"Sariq",color:0xf5c542,start:39}
];

const material=(c)=>new THREE.MeshStandardMaterial({
 color:c,roughness:.42,metalness:.25
});

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 material(0x172432)
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.5;
floor.receiveShadow=true;
scene.add(floor);

const board=new THREE.Mesh(
 new THREE.BoxGeometry(12,.4,12),
 material(0x35485b)
);
board.position.y=-.2;
board.castShadow=true;
board.receiveShadow=true;
scene.add(board);

// 52 katakli yo‘l
const path=[];
for(let x=-6;x<=6;x++)path.push([x,-6]);
for(let z=-5;z<=6;z++)path.push([6,z]);
for(let x=5;x>=-6;x--)path.push([x,6]);
for(let z=5;z>=-5;z--)path.push([-6,z]);

path.forEach((p,i)=>{
 const tile=new THREE.Mesh(
  new THREE.BoxGeometry(.86,.13,.86),
  material(i%13===0?0xf0c45b:0xd5d8dc)
 );
 tile.position.set(p[0],.06,p[1]);
 tile.receiveShadow=true;
 tile.castShadow=true;
 scene.add(tile);
});

// Jamoalar uylari
const homes=[
 [-4.3,-4.3],[4.3,-4.3],
 [4.3,4.3],[-4.3,4.3]
];

homes.forEach((p,i)=>{
 const pad=new THREE.Mesh(
  new THREE.BoxGeometry(3, .2,3),
  material(colors[i].color)
 );
 pad.position.set(p[0],.12,p[1]);
 scene.add(pad);
});

// Jangchi yaratish
function createWarrior(ci){
 const g=new THREE.Group();
 const armor=material(colors[ci].color);
 const gold=material(0xe8bd5e);
 const dark=material(0x252d39);
 const skin=material(0xc58e68);

 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(.22,.3,.65,12),armor
 );
 body.position.y=.75;
 g.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.22,16,16),skin
 );
 head.position.y=1.25;
 g.add(head);

 const helmet=new THREE.Mesh(
  new THREE.SphereGeometry(.25,16,12),
  gold
 );
 helmet.scale.y=.7;
 helmet.position.y=1.36;
 g.add(helmet);

 const crest=new THREE.Mesh(
  new THREE.ConeGeometry(.1,.35,8),gold
 );
 crest.position.y=1.57;
 g.add(crest);

 for(const side of [-1,1]){
  const arm=new THREE.Mesh(
   new THREE.CylinderGeometry(.07,.09,.4,8),armor
  );
  arm.position.set(side*.3,.85,0);
  arm.rotation.z=side*.4;
  g.add(arm);

  const leg=new THREE.Mesh(
   new THREE.CylinderGeometry(.09,.11,.35,8),dark
  );
  leg.position.set(side*.13,.28,0);
  g.add(leg);
 }

 // Nayza
 const spear=new THREE.Group();
 const shaft=new THREE.Mesh(
  new THREE.CylinderGeometry(.025,.035,1.15,8),
  material(0x8b6037)
 );
 shaft.position.y=.65;
 spear.add(shaft);

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(.09,.27,6),gold
 );
 tip.position.y=1.34;
 spear.add(tip);
 spear.position.set(.35,.1,0);
 g.add(spear);
 g.userData.spear=spear;

 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.34,.34,.12,24),dark
 );
 base.position.y=.06;
 g.add(base);

 g.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 g.userData.team=ci;
 return g;
}

const warriors=[];
const states=[];

for(let ci=0;ci<4;ci++){
 warriors[ci]=[];
 states[ci]=[];

 for(let j=0;j<4;j++){
  const w=createWarrior(ci);
  scene.add(w);
  warriors[ci].push(w);
  states[ci].push({step:-1,done:false});
 }
}

function homePosition(ci,j){
 const p=homes[ci];
 return [
  p[0]+(j%2?.65:-.65),
  p[1]+(j<2?-.65:.65)
 ];
}

function globalIndex(ci,step){
 return (colors[ci].start+step)%52;
}

function updatePositions(){
 for(let ci=0;ci<4;ci++){
  for(let j=0;j<4;j++){
   const s=states[ci][j];
   const w=warriors[ci][j];

   if(s.step<0){
    const p=homePosition(ci,j);
    w.position.set(p[0],.22,p[1]);
   }else{
    const p=path[globalIndex(ci,s.step)];
    w.position.set(p[0],.22,p[1]);
   }
  }
 }
}
updatePositions();

let current=0;
let dice=null;
let busy=false;

const turn=document.getElementById("turn");
const status=document.getElementById("status");
const message=document.getElementById("message");
const rollButton=document.getElementById("roll");

function notify(t){
 message.textContent=t;
}

function updateUI(){
 turn.textContent="Navbat: "+colors[current].name;
 status.textContent=dice===null?"Zarni tashlang":"Zar: "+dice+" — jangchini bosing";
 rollButton.disabled=dice!==null||busy;
}

function nextTurn(){
 dice=null;
 current=(current+1)%4;
 updateUI();
}

rollButton.onclick=()=>{
 if(dice!==null||busy)return;

 dice=1+Math.floor(Math.random()*6);
 notify("Zar: "+dice);

 const possible=states[current].some(s=>
  s.step<0?dice===6:!s.done&&s.step+dice<=56
 );

 updateUI();

 if(!possible){
  notify("Yurish yo‘q. Keyingi jamoa!");
  setTimeout(nextTurn,900);
 }
};

// Portlash effekti
function explosion(pos){
 const group=new THREE.Group();
 group.position.copy(pos);
 scene.add(group);

 const particles=[];
 const gold=material(0xffc34c);

 for(let i=0;i<24;i++){
  const m=new THREE.Mesh(
   new THREE.SphereGeometry(.08,8,8),gold
  );
  group.add(m);
  particles.push({
   mesh:m,
   velocity:new THREE.Vector3(
    (Math.random()-.5)*.2,
    Math.random()*.2,
    (Math.random()-.5)*.2
   )
  });
 }

 const start=performance.now();

 function animate(now){
  const t=(now-start)/650;
  particles.forEach(p=>{
   p.mesh.position.add(p.velocity);
   p.mesh.scale.setScalar(Math.max(.01,1-t));
  });

  if(t<1)requestAnimationFrame(animate);
  else scene.remove(group);
 }
 requestAnimationFrame(animate);
}

function capture(ci,j,callback){
 const w=warriors[ci][j];
 const start=performance.now();
 const original=w.position.clone();

 function animate(now){
  const t=Math.min(1,(now-start)/550);
  w.position.y=.22+Math.sin(t*Math.PI)*.9;
  w.userData.spear.rotation.z=Math.sin(t*Math.PI)*1.1;

  if(t<1)requestAnimationFrame(animate);
  else{
   w.userData.spear.rotation.z=0;
   explosion(original);
   states[ci][j].step=-1;
   updatePositions();
   callback();
  }
 }
 requestAnimationFrame(animate);
}

function moveWarrior(ci,j){
 if(busy||dice===null||ci!==current)return;

 const s=states[ci][j];

 if(s.step<0&&dice!==6){
  notify("Uyidan chiqish uchun 6 kerak!");
  return;
 }

 if(s.step>=0&&s.step+dice>56){
  notify("Bu yurish mumkin emas!");
  return;
 }

 const old=s.step;
 const steps=old<0?0:dice;
 const target=old<0?0:old+dice;
 const w=warriors[ci][j];

 busy=true;
 const from=w.position.clone();
 const dest=path[globalIndex(ci,target)];
 const to=new THREE.Vector3(dest[0],.22,dest[1]);
 const duration=Math.max(300,Math.abs(target-(old<0?0:old))*110);
 const start=performance.now();

 function animate(now){
  const t=Math.min(1,(now-start)/duration);
  w.position.lerpVectors(from,to,t);
  w.position.y=.22+Math.abs(Math.sin(t*Math.PI*8))*.1;

  if(t<1)requestAnimationFrame(animate);
  else{
   w.position.copy(to);
   s.step=target;

   if(target>=56){
    s.done=true;
    w.position.set(0,.4,0);
    busy=false;
    notify(colors[ci].name+" jamoasi bir jangchini marraga yetkazdi!");
    finish();
    return;
   }

   const idx=globalIndex(ci,target);
   let victim=null;

   for(let oi=0;oi<4;oi++){
    if(oi===ci)continue;
    for(let oj=0;oj<4;oj++){
     const os=states[oi][oj];
     if(os.step>=0&&!os.done&&globalIndex(oi,os.step)===idx){
      victim={ci:oi,j:oj};
      break;
     }
    }
    if(victim)break;
   }

   if(victim){
    notify("⚔ Nayzali jang! Raqib uyiga qaytdi!");
    capture(victim.ci,victim.j,()=>{
     busy=false;
     finish();
    });
   }else{
    busy=false;
    finish();
   }
  }
 }
 requestAnimationFrame(animate);
}

function finish(){
 const won=states[current].every(s=>s.done);
 if(won){
  notify("🏆 "+colors[current].name+" jamoasi g‘alaba qozondi!");
  dice=null;
  updateUI();
  return;
 }
 const extra=dice===6;
 dice=null;
 if(!extra)current=(current+1)%4;
 updateUI();
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const all=warriors.flat();

renderer.domElement.addEventListener("pointerdown",e=>{
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(all,true);
 if(!hits.length)return;

 let node=hits[0].object;
 while(node&&!all.includes(node))node=node.parent;

 if(node){
  const n=all.indexOf(node);
  moveWarrior(Math.floor(n/4),n%4);
 }
});

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.position.y=innerWidth<650?19:16;
 camera.position.z=innerWidth<650?22:19;
 camera.lookAt(0,0,0);
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener("resize",resize);

function render(){
 requestAnimationFrame(render);
 renderer.render(scene,camera);
}
updateUI();
render();
</script>
</body>
</html>
