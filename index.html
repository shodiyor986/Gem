
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LUDO WARRIORS 2D + 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b27;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}
#board,#game3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#game3d{pointer-events:auto}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#091625ed;border:1px solid #ffffff35;border-radius:12px;padding:9px 11px}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:5px}

button:disabled{opacity:.4}

}

</head>
<body>
<div id="game">
 <canvas id="board"></canvas>
 <div id="game3d"></div>
</div>

<div id="hud">
 <div id="top">
  <div class="panel">
   <div id="brand">⚔ LUDO WARRIORS</div>
   <div id="turn">Navbat: Qizil</div>
   <div id="status">Zarni tashlang</div>
  </div>
  <div id="right">
   <div class="panel" id="dice">🎲</div>
   <button id="roll">ZAR TASHLA</button>
  </div>
 </div>
 <div id="bottom">
  <div class="panel" id="message">Jangchini tanlang!<br>🕳 Maxluq · 🚀 Raketa · ⭐ Bonus</div>
  <div class="panel" id="scores"></div>
 </div>
 <div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";

/* =================================
   1. OPTIMALLASHTIRILGAN 3D SAHNA
================================= */

const scene=new THREE.Scene();

const camera=new THREE.OrthographicCamera(
 -8,8,8,-8,.1,100
);
camera.position.set(0,25,0);
camera.up.set(0,0,-1);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
 alpha:true,
 antialias:false,
 powerPreference:"low-power"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.getElementById("game3d").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526070,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,12,5);
scene.add(sun);

function mat(color){
 return new THREE.MeshLambertMaterial({color});
}

const colors=[
 {name:"Qizil",color:0xe33e48,start:0},
 {name:"Yashil",color:0x20b978,start:13},
 {name:"Ko‘k",color:0x3289ed,start:26},
 {name:"Sariq",color:0xeab83b,start:39}
];

const gold=mat(0xe7c16c);
const dark=mat(0x263746);

/* =================================
   2. 2D DOSKA
================================= */

const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const path=[];
for(let side=0;side<4;side++){
 for(let i=0;i<13;i++){
  const t=-5.5+i*(11/12);
  if(side===0)path.push([t,-6]);
  if(side===1)path.push([6,t]);
  if(side===2)path.push([-t,6]);
  if(side===3)path.push([-6,-t]);
 }
}

const traps=[5,18,31,44];
const rockets=[9,22,35,48];
const stars=[2,15,28,41];

const homes=[
 [-4.4,-4.4],
 [4.4,-4.4],
 [4.4,4.4],
 [-4.4,4.4]
];

let scale=1,cx=0,cy=0;

function screen(x,z){
 return [cx+x*scale,cy+z*scale];
}

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawTile(x,z,color){
 const p=screen(x,z);
 const s=scale*.42;

 roundedRect(
  p[0]-s,p[1]-s,s*2,s*2,
  scale*.08,color
 );

 ctx.strokeStyle="#ffffff70";
 ctx.lineWidth=Math.max(1,scale*.025);
 ctx.strokeRect(p[0]-s,p[1]-s,s*2,s*2);
}

function drawBoard(){

 const w=innerWidth,h=innerHeight;
 const dpr=Math.min(devicePixelRatio||1,1.5);

 canvas.width=Math.round(w*dpr);
 canvas.height=Math.round(h*dpr);
 canvas.style.width=w+"px";
 canvas.style.height=h+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,w,h);

 scale=Math.min(w,h)*.82/15;
 cx=w/2;
 cy=h/2;

 // Orqa fon
 ctx.fillStyle="#101b27";
 ctx.fillRect(0,0,w,h);

 // Doska soyasi
 const boardSize=14.8*scale;
 roundedRect(
  cx-boardSize/2+4,
  cy-boardSize/2+6,
  boardSize,boardSize,
  scale*.35,"#050c15"
 );

 // Doska
 roundedRect(
  cx-boardSize/2,
  cy-boardSize/2,
  boardSize,boardSize,
  scale*.35,"#d6b36c"
 );

 roundedRect(
  cx-boardSize/2+scale*.12,
  cy-boardSize/2+scale*.12,
  boardSize-scale*.24,
  boardSize-scale*.24,
  scale*.25,"#253e52"
 );

 // To'rt uy
 for(let i=0;i<4;i++){
  const p=screen(homes[i][0],homes[i][1]);
  const s=scale*1.55;

  roundedRect(
   p[0]-s,p[1]-s,s*2,s*2,
   scale*.18,"#"+colors[i].color.toString(16)
  );

  roundedRect(
   p[0]-s*.82,p[1]-s*.82,s*1.64,s*1.64,
   scale*.14,"#263b4e"
  );

  for(let j=0;j<4;j++){
   const x=homes[i][0]+(j%2?.65:-.65);
   const z=homes[i][1]+(j<2?-.65:.65);
   const q=screen(x,z);

   ctx.beginPath();
   ctx.arc(q[0],q[1],scale*.29,0,Math.PI*2);
   ctx.fillStyle="#e4d5b2";
   ctx.fill();
   ctx.strokeStyle="#ffffff";
   ctx.lineWidth=2;
   ctx.stroke();
  }
 }

 // Asosiy yo'l
 path.forEach((p,i)=>{
  let color="#e7edf2";
  if(traps.includes(i))color="#923c46";
  if(rockets.includes(i))color="#287bc0";
  if(stars.includes(i))color="#c69a35";
  drawTile(p[0],p[1],color);

  const q=screen(p[0],p[1]);

  if(traps.includes(i)){
   ctx.beginPath();
   ctx.arc(q[0],q[1],scale*.19,0,Math.PI*2);
   ctx.fillStyle="#10151b";
   ctx.fill();
   ctx.strokeStyle="#e48c6d";
   ctx.lineWidth=2;
   ctx.stroke();
  }

  if(rockets.includes(i)){
   ctx.font=`${scale*.42}px Arial`;
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText("🚀",q[0],q[1]);
  }

  if(stars.includes(i)){
   ctx.font=`${scale*.42}px Arial`;
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText("⭐",q[0],q[1]);
  }
 });

 // Finish yo'laklari
 for(let ci=0;ci<4;ci++){
  const entry=path[(colors[ci].start+51)%52];

  for(let i=1;i<=5;i++){
   const t=i/5;
   const x=entry[0]*(1-t);
   const z=entry[1]*(1-t);

   drawTile(x,z,"#"+colors[ci].color.toString(16));
  }
 }

 // Markaz
 const center=screen(0,0);

 ctx.beginPath();
 ctx.arc(center[0],center[1],scale*.85,0,Math.PI*2);
 ctx.fillStyle="#d4a84e";
 ctx.fill();
 ctx.strokeStyle="#ffe8ad";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(center[0],center[1],scale*.55,0,Math.PI*2);
 ctx.fillStyle="#fff0bd";
 ctx.fill();

 ctx.font=`bold ${scale*.65}px Arial`;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle="#59401c";
 ctx.fillText("🏆",center[0],center[1]);
}

/* =================================
   3. 3D JANGCHILAR
================================= */

function createWarrior(ci){

 const root=new THREE.Group();
 const armor=mat(colors[ci].color);
 const skin=mat(0xb98767);

 function add(geo,material,x,y,z){
  const m=new THREE.Mesh(geo,material);
  m.position.set(x,y,z);
  root.add(m);
  return m;
 }

 add(new THREE.CylinderGeometry(.23,.29,.55,8),armor,0,.55,0);
 add(new THREE.SphereGeometry(.19,10,8),skin,0,.95,0);

 const helmet=add(
  new THREE.SphereGeometry(.24,10,8),
  gold,0,1.08,0
 );
 helmet.scale.y=.7;

 add(
  new THREE.ConeGeometry(.09,.27,6),
  mat(0xa72e3a),0,1.35,0
 );

 // Qalqon
 const shield=add(
  new THREE.CylinderGeometry(.22,.22,.08,6),
  gold,-.36,.57,.05
 );
 shield.rotation.x=Math.PI/2;

 // Nayza
 const spear=new THREE.Group();

 const shaft=new THREE.Mesh(
  new THREE.CylinderGeometry(.025,.035,.95,6),
  mat(0x765334)
 );
 shaft.position.y=.5;
 spear.add(shaft);

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(.09,.25,6),
  gold
 );
 tip.position.y=1.05;
 spear.add(tip);

 spear.position.set(.33,.1,0);
 root.add(spear);

 // Oyoqlar
 const legs=[];
 for(const side of [-1,1]){
  const leg=add(
   new THREE.CylinderGeometry(.075,.1,.35,6),
   dark,side*.13,.2,0
  );
  legs.push(leg);
 }

 root.userData={spear,legs};

 return root;
}

const warriors=[];
const states=[];

for(let ci=0;ci<4;ci++){
 warriors[ci]=[];
 states[ci]=[];

 for(let j=0;j<4;j++){
  const w=createWarrior(ci);
  scene.add(w);
  warriors[ci].push(w);

  states[ci].push({
   step:-1,
   done:false
  });
 }
}

/* =================================
   4. MAXLUQ 3D MODELI
================================= */

function createMonster(){

 const group=new THREE.Group();
 const bodyMat=mat(0x354b3c);

 const body=new THREE.Mesh(
  new THREE.SphereGeometry(.45,10,8),
  bodyMat
 );
 body.scale.set(1,1.25,.85);
 body.position.y=.55;
 group.add(body);

 const eyesMat=new THREE.MeshBasicMaterial({color:0xff3322});

 for(const side of [-1,1]){
  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(.085,8,6),
   eyesMat
  );
  eye.position.set(side*.17,.85,.35);
  group.add(eye);

  const horn=new THREE.Mesh(
   new THREE.ConeGeometry(.11,.35,6),
   gold
  );
  horn.position.set(side*.3,1.12,0);
  group.add(horn);
 }

 return group;
}

/* =================================
   5. POZITSIYALAR
================================= */

function homePosition(ci,j){
 const p=homes[ci];
 return [
  p[0]+(j%2?.65:-.65),
  p[1]+(j<2?-.65:.65)
 ];
}

function globalIndex(ci,step){
 return (colors[ci].start+step)%52;
}

function finishLane(ci,step){
 const entry=path[(colors[ci].start+51)%52];
 const t=(step-51)/5;
 return [
  entry[0]*(1-t),
  entry[1]*(1-t)
 ];
}

function getPosition(ci,s,j){
 if(s.step<0)return homePosition(ci,j);
 if(s.step>=56)return [0,0];
 if(s.step>=52)return finishLane(ci,s.step);
 return path[globalIndex(ci,s.step)];
}

function updatePositions(){
 for(let ci=0;ci<4;ci++){
  for(let j=0;j<4;j++){
   const s=states[ci][j];
   const p=getPosition(ci,s,j);
   warriors[ci][j].position.set(p[0],.2,p[1]);
  }
 }
}

/* =================================
   6. OVOZ
================================= */

let audio=null;

function sound(type){
 try{
  audio ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();

  const cfg={
   dice:[260,.13],
   walk:[140,.07],
   spear:[110,.3],
   boom:[65,.45],
   rocket:[450,.3],
   star:[880,.25],
   trap:[75,.4]
  }[type]||[200,.1];

  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.connect(gain);
  gain.connect(audio.destination);

  const now=audio.currentTime;
  osc.frequency.setValueAtTime(cfg[0],now);
  osc.frequency.exponentialRampToValueAtTime(
   Math.max(30,cfg[0]*.3),now+cfg[1]
  );

  gain.gain.setValueAtTime(.001,now);
  gain.gain.linearRampToValueAtTime(.12,now+.02);
  gain.gain.exponentialRampToValueAtTime(.001,now+cfg[1]);

  osc.start(now);
  osc.stop(now+cfg[1]+.03);
 }catch(e){}
}

/* =================================
   7. O'YIN HOLATI
================================= */

let current=0;
let dice=null;
let busy=false;
let gameOver=false;

function toast(text){
 const el=document.getElementById("toast");
 el.textContent=text;
 el.style.opacity=1;
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>el.style.opacity=0,1800);
}

function updateUI(){
 document.getElementById("turn").textContent=
  "Navbat: "+colors[current].name;

 document.getElementById("status").textContent=
  dice===null?"Zarni tashlang":"Zar: "+dice+" — jangchini tanlang";

 document.getElementById("roll").disabled=
  dice!==null||busy||gameOver;

 document.getElementById("scores").innerHTML=
  colors.map((c,i)=>
   `<span style="color:#${c.color.toString(16)}">${c.name}: ${states[i].filter(x=>x.done).length}/4</span><br>`
  ).join("");
}

function nextTurn(extra=false){
 dice=null;
 if(!extra)current=(current+1)%4;
 updateUI();
}

/* =================================
   8. ZAR
================================= */

document.getElementById("roll").onclick=()=>{
 if(busy||dice!==null||gameOver)return;

 sound("dice");
 dice=1+Math.floor(Math.random()*6);

 document.getElementById("dice").textContent=
  ["⚀","⚁","⚂","⚃","⚄","⚅"][dice-1];

 const possible=states[current].some(s=>
  !s.done&&(s.step<0?dice===6:s.step+dice<=56)
 );

 updateUI();

 if(!possible){
  toast("Bu yurishda mos jangchi yo‘q!");
  setTimeout(()=>nextTurn(),800);
 }
};

/* =================================
   9. PORTLASH
================================= */

function explosion(pos){
 sound("boom");

 const particles=[];
 const group=new THREE.Group();
 group.position.copy(pos);
 scene.add(group);

 for(let i=0;i<14;i++){
  const m=new THREE.Mesh(
   new THREE.SphereGeometry(.08,6,5),
   mat(i%2?0xff702d:0xffd24b)
  );
  group.add(m);

  particles.push({
   mesh:m,
   velocity:new THREE.Vector3(
    (Math.random()-.5)*.25,
    Math.random()*.2,
    (Math.random()-.5)*.25
   )
  });
 }

 const start=performance.now();

 function animate(now){
  const t=Math.min(1,(now-start)/550);

  particles.forEach(p=>{
   p.mesh.position.add(p.velocity);
   p.mesh.scale.setScalar(1-t);
  });

  if(t<1)requestAnimationFrame(animate);
  else scene.remove(group);
 }
 requestAnimationFrame(animate);
}

/* =================================
   10. MAXLUQ HUJUMI
================================= */

function monsterAttack(w,done){
 sound("trap");

 const monster=createMonster();
 const x=w.position.x;
 const z=w.position.z;

 monster.position.set(x,-1.3,z);
 scene.add(monster);

 const start=performance.now();

 function emerge(now){
  const t=Math.min(1,(now-start)/600);
  monster.position.y=-1.3+1.5*t;
  monster.rotation.z=Math.sin(t*5)*.08;

  if(t<1){
   requestAnimationFrame(emerge);
   return;
  }

  const swallowStart=performance.now();

  function swallow(time){
   const k=Math.min(1,(time-swallowStart)/500);
   w.position.y=.2+1.2*k;
   w.scale.setScalar(1-k*.9);

   if(k<1){
    requestAnimationFrame(swallow);
   }else{
    scene.remove(monster);
    w.scale.setScalar(1);
    w.position.y=.2;
    done();
   }
  }
  requestAnimationFrame(swallow);
 }
 requestAnimationFrame(emerge);
}

/* =================================
   11. RAQIBNI URISH
================================= */

function findVictim(ci,step){
 if(step<0||step>=52)return null;

 const idx=globalIndex(ci,step);

 for(let oi=0;oi<4;oi++){
  if(oi===ci)continue;

  for(let oj=0;oj<4;oj++){
   const s=states[oi][oj];

   if(!s.done&&s.step>=0&&s.step<52&&
      globalIndex(oi,s.step)===idx){
    return {team:oi,index:oj};
   }
  }
 }
 return null;
}

function capture(victimTeam,victimIndex,attackerTeam,attackerIndex,done){
 const victim=warriors[victimTeam][victimIndex];
 const attacker=warriors[attackerTeam][attackerIndex];

 const spear=attacker.userData.spear;
 const original=spear.rotation.x;

 sound("spear");
 const start=performance.now();

 function attack(now){
  const t=Math.min(1,(now-start)/700);

  spear.rotation.x=original-Math.sin(t*Math.PI)*1.5;
  victim.position.y=.2+Math.sin(t*Math.PI)*.4;

  if(t<1){
   requestAnimationFrame(attack);
  }else{
   spear.rotation.x=original;
   victim.position.y=.2;

   explosion(victim.position.clone());

   states[victimTeam][victimIndex].step=-1;
   updatePositions();
   done();
  }
 }
 requestAnimationFrame(attack);
}

/* =================================
   12. YURISH
================================= */

function animateWalk(w,from,to,done){
 const start=performance.now();
 const duration=145;

 sound("walk");

 function animate(now){
  const t=Math.min(1,(now-start)/duration);

  w.position.lerpVectors(from,to,t);
  w.position.y=.2+Math.abs(Math.sin(t*Math.PI*2))*.09;

  if(t<1)requestAnimationFrame(animate);
  else{
   w.position.copy(to);
   w.position.y=.2;
   done();
  }
 }
 requestAnimationFrame(animate);
}

/* =================================
   13. YURISHNI BAJARISH
================================= */

function moveWarrior(ci,j){
 if(busy||dice===null||ci!==current||gameOver)return;

 const s=states[ci][j];
 if(s.done)return;

 if(s.step<0&&dice!==6){
  toast("Jangchini chiqarish uchun 6 kerak!");
  return;
 }

 if(s.step>=0&&s.step+dice>56){
  toast("Finish uchun aniq son kerak!");
  return;
 }

 busy=true;

 const rolled=dice;
 const target=s.step<0?0:s.step+rolled;
 let step=s.step<0?-1:s.step;

 const w=warriors[ci][j];

 function finishGame(){
  s.done=true;
  w.position.set(0,.25,0);

  busy=false;
  toast("🏆 Jangchi marraga yetdi!");

  if(states[ci].every(x=>x.done)){
   gameOver=true;
   toast("🏆 "+colors[ci].name+" G‘OLIB!");
   dice=null;
   updateUI();
  }else{
   nextTurn(rolled===6);
  }
 }

 function finishMove(){
  if(s.step===56){
   finishGame();
   return;
  }

  const idx=s.step<52?globalIndex(ci,s.step):-1;

  if(traps.includes(idx)){
   toast("👹 Maxluq hujum qilmoqda!");

   monsterAttack(w,()=>{
    s.step=-1;
    updatePositions();
    busy=false;
    nextTurn(rolled===6);
   });
   return;
  }

  if(rockets.includes(idx)){
   sound("rocket");
   toast("🚀 Raketa! 5 qadam oldinga!");

   s.step=Math.min(56,s.step+5);
   updatePositions();

   if(s.step===56){
    finishGame();
    return;
   }
  }

  if(stars.includes(idx)){
   sound("star");
   toast("⭐ Yulduz! Yana bir yurish!");

   updatePositions();
   busy=false;
   dice=null;
   updateUI();
   return;
  }

  updatePositions();
  busy=false;
  nextTurn(rolled===6);
 }

 function oneStep(){
  if(step>=target){
   s.step=target;

   if(target===56){
    finishGame();
    return;
   }

   const victim=findVictim(ci,target);

   if(victim){
    toast("⚔ Nayza hujumi!");

    capture(
     victim.team,victim.index,
     ci,j,finishMove
    );
   }else{
    finishMove();
   }
   return;
  }

  step++;

  const p=step>=52
   ?finishLane(ci,step)
   :path[globalIndex(ci,step)];

  const from=w.position.clone();
  const to=new THREE.Vector3(p[0],.2,p[1]);

  animateWalk(w,from,to,oneStep);
 }

 oneStep();
}

/* =================================
   14. JANGCHINI TANLASH
================================= */

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const all=warriors.flat();

renderer.domElement.addEventListener("pointerdown",e=>{
 if(busy||dice===null||gameOver)return;

 const rect=renderer.domElement.getBoundingClientRect();

 pointer.x=(e.clientX-rect.left)/rect.width*2-1;
 pointer.y=-(e.clientY-rect.top)/rect.height*2+1;

 raycaster.setFromCamera(pointer,camera);

 const hits=raycaster.intersectObjects(all,true);
 if(!hits.length)return;

 let node=hits[0].object;

 while(node&&!all.includes(node)){
  node=node.parent;
 }

 if(node){
  const n=all.indexOf(node);
  moveWarrior(Math.floor(n/4),n%4);
 }
});

/* =================================
   15. MOSLASH VA TEZLIK
================================= */

function resize(){
 drawBoard();

 const aspect=innerWidth/innerHeight;
 const viewH=15/(Math.min(innerWidth,innerHeight)*.82/Math.min(innerWidth,innerHeight));

 camera.left=-viewH*aspect/2;
 camera.right=viewH*aspect/2;
 camera.top=viewH/2;
 camera.bottom=-viewH/2;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));
}

addEventListener("resize",resize);

/* =================================
   16. YAKUNIY ISHGA TUSHIRISH
================================= */

let lastFrame=0;

function render(now){
 requestAnimationFrame(render);

 // 30 FPS cheklovi — telefon uchun yengilroq
 if(now-lastFrame<33)return;
 lastFrame=now;

 renderer.render(scene,camera);
}

resize();
updatePositions();
updateUI();

requestAnimationFrame(render);

</script>
